<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <title>Gist · Offline</title>
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: light dark; --ground: #F3F5F1; --card: #FFFFFF; --edge: #E2E7E2; --ink: #13211D; --ink-muted: #53635D; }
      @media (prefers-color-scheme: dark) {
        :root { --ground: #0E1412; --card: #171E1B; --edge: #28312E; --ink: #EDF3EF; --ink-muted: #AFBDB6; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: var(--ground); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 460px); padding: 32px; border: 1px solid var(--edge); border-radius: 24px; background: var(--card); box-shadow: 0 18px 45px rgba(16, 46, 39, .12); }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: var(--ink-muted); line-height: 1.55; }
      .translations { margin-top: 18px; padding-top: 18px; border-top: 1px solid #e8e6de; font-size: 13px; }
      a { display: inline-block; margin-top: 24px; padding: 12px 18px; border-radius: 999px; color: #fff; background: #102e27; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/gist-icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Reconnect to verify access and refresh your private workplace.</p>
      <div class="translations">
        <p lang="ko">오프라인 상태입니다. 접근 권한을 확인하고 비공개 작업 공간을 새로 고치려면 다시 연결하세요.</p>
        <p lang="es">Estás sin conexión. Vuelve a conectarte para verificar el acceso y actualizar tu espacio privado.</p>
      </div>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
