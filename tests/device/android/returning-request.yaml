appId: com.totallynotwoojin.newone
---
# Android variant of common/returning-request.yaml (v3.2 flow): no
# retype-if-not-visible hack (the typed email sits behind the keyboard on
# Android), just the plain path to the password step.
- extendedWaitUntil:
    visible: "(Returning member|Sign in)"
    timeout: 30000
- tapOn: "English"
- tapOn:
    text: "(Returning member|Sign in)"
    index: 0
- extendedWaitUntil:
    visible:
      id: "sign-in-destination"
    timeout: 15000
- tapOn:
    id: "sign-in-destination"
- eraseText: 120
- inputText: ${EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible:
      id: "password"
    timeout: 30000
