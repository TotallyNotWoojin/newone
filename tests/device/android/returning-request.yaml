appId: com.totallynotwoojin.newone
---
# Android variant of common/returning-request.yaml: no retype-if-not-visible
# hack (the typed email sits behind the keyboard on Android), just the plain path.
- extendedWaitUntil:
    visible: "(Returning member|Sign in)"
    timeout: 30000
- tapOn: "English"
- tapOn:
    text: "(Returning member|Sign in)"
    index: 0
- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible: "One-time code"
    timeout: 30000
