appId: com.totallynotwoojin.newone
---
# Android variant of common/returning-verify.yaml (v3.2 flow): the password
# field does not expose its typed value as visible text on Android, so type the
# password, tap Sign in, and let the Chats screen prove the sign-in. Env: PASSWORD.
- extendedWaitUntil:
    visible:
      id: "password"
    timeout: 15000
- tapOn:
    id: "password"
- eraseText: 60
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Sign in"
    direction: DOWN
    timeout: 15000
- tapOn: "Sign in"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${SHOT}-android-after-sign-in
- extendedWaitUntil:
    visible: "Chats"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Not now"
    optional: true
