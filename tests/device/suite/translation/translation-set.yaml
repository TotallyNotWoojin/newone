appId: com.totallynotwoojin.newone
---
# Controls → Automatic translation → MODE chip.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# v3.5: the sheet states the setting on one row and opens the choices.
# The row announces itself as "Automatic translation: <current setting>" — one
# label, because the Pressable merges its children on iOS — so match part of
# it, not the whole line.
- extendedWaitUntil:
    visible: ".*Automatic translation.*"
    timeout: 20000
- tapOn: ".*Automatic translation.*"
- extendedWaitUntil:
    visible: "Automatic"
    timeout: 15000
- tapOn: ${MODE}
- extendedWaitUntil:
    visible:
      text: ${MODE}
      selected: true
    timeout: 20000
- takeScreenshot: ${SHOT}-${MODE}
- tapOn: "Close dialog"
- runFlow:
    when:
      visible: "Close dialog"
    commands:
      - tapOn: "Close dialog"
