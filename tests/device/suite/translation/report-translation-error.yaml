appId: com.totallynotwoojin.newone
---
# The button sits at the bottom of the translation card and can be below the
# composer; bring it fully into view first.
- scrollUntilVisible:
    element:
      text: "Report translation error"
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
# Maestro measures visibility against the screen, but the composer and the
# "Translation available" bar overlay the bottom of the list; nudge the list up
# so the button clears them (run-2026-09-04T22-30-16 tapped the bar instead).
- swipe:
    start: "50%, 70%"
    end: "50%, 40%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Report translation error"
    index: 0
- extendedWaitUntil:
    visible: "AI quality review"
    timeout: 15000
- tapOn: "Incorrect meaning"
- tapOn:
    text: "Describe what went wrong"
    index: 1
- inputText: "Device suite: wording check"
- tapOn: "AI quality review"
- takeScreenshot: ${SHOT}-form
- tapOn: "Submit quality report"
- extendedWaitUntil:
    visible: ".*(Quality report submitted|could not|cannot|failed).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-submitted
- extendedWaitUntil:
    notVisible: "AI quality review"
    timeout: 20000
