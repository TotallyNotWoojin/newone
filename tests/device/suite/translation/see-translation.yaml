appId: com.totallynotwoojin.newone
---
# The peer's message TEXT arrives, then its translation card for LANG.
# Returning from Settings can leave the thread at its top with the keyboard
# up (trans-11, run-2026-09-04T07-12-12): dismiss and scroll to the message.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
# Scroll first: after Settings the thread can sit at its top (trans-11,
# run-2026-09-04T13-40-24 waited 45 s for a message that was below the fold).
# Scrolling down also ends at the bottom, where a message still in flight lands.
- scrollUntilVisible:
    element:
      text: ".*${TEXT}.*"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-original-arrived
- extendedWaitUntil:
    visible: ".*TRANSLATION · ${LANG}.*"
    timeout: ${TIMEOUT}
- takeScreenshot: ${SHOT}-translated
- assertVisible: ".*ORIGINAL · .*"
- assertVisible: ".*${TEXT}.*"