appId: com.totallynotwoojin.newone
---
- stopApp
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- extendedWaitUntil:
    notVisible: ".*${NAME}.*"
    timeout: 45000
- takeScreenshot: ${SHOT}-not-listed
