appId: com.totallynotwoojin.newone
---
# The group appears (or not) in this member's Chats list.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: ".*${NAME}.*"
    commands:
      - tapOn: "Chats"
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 45000
- takeScreenshot: ${SHOT}-listed
