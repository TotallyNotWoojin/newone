appId: com.totallynotwoojin.newone
---
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Remove ${NAME}"
    direction: DOWN
    timeout: 30000
- tapOn: "Remove ${NAME}"
- extendedWaitUntil:
    notVisible: "Remove ${NAME}"
    timeout: 20000
- takeScreenshot: ${SHOT}-removed
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*was removed from the group.*"
    timeout: 30000
