appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 50): the people in a group are actionable where you notice
# them. Conversation settings → "People in this group" → a member's
# "Options for <name>" → Message, Add as friend, Mute, Block and (for owners
# and admins) Remove from group.
#
# This flow exercises the four that leave the sheet open: add as friend, mute,
# unmute, block, unblock. "Message" leaves the group (groups/member-message)
# and "Remove from group" ends the membership (groups/member-remove).
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "People in this group"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-members-section
- scrollUntilVisible:
    element:
      text: "Options for ${NAME}"
    direction: DOWN
    timeout: 30000
- tapOn: "Options for ${NAME}"
- extendedWaitUntil:
    visible: "Add as friend"
    timeout: 15000
- assertVisible: "Mute"
- assertVisible: "Block"
# The expanded actions can sit below the sheet's fold. The driver still reports
# them visible, so a tap lands on the backdrop and dismisses the whole sheet
# (run-2026-09-08T04-50-00: three steps lost this way). Scroll each action
# fully onto the screen before touching it.
- scrollUntilVisible:
    element:
      text: "Add as friend"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- takeScreenshot: ${SHOT}-member-actions
- tapOn: "Add as friend"
- extendedWaitUntil:
    visible: "Request sent"
    timeout: 20000
- takeScreenshot: ${SHOT}-friend-requested
- scrollUntilVisible:
    element:
      text: "Mute"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Mute"
- extendedWaitUntil:
    visible: "Unmute"
    timeout: 20000
# The row's own line records it, next to the @handle.
- assertVisible: ".*Muted.*"
- takeScreenshot: ${SHOT}-muted
- scrollUntilVisible:
    element:
      text: "Unmute"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Unmute"
- extendedWaitUntil:
    visible: "Mute"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Block"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Block"
- extendedWaitUntil:
    visible: "Unblock"
    timeout: 20000
- assertVisible: ".*Blocked.*"
- takeScreenshot: ${SHOT}-blocked
- scrollUntilVisible:
    element:
      text: "Unblock"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Unblock"
- extendedWaitUntil:
    visible: "Block"
    timeout: 20000
- takeScreenshot: ${SHOT}-unblocked
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
