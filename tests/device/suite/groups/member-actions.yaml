appId: com.totallynotwoojin.newone
---
# v3.4: one menu per person. Conversation settings → "People in this group" →
# "Options for <name>" opens that member's sheet, which carries Message, Add as
# friend, Mute, Block, the role chips and Remove from group. Every action names
# the person, so five members never offer five identical "Mute" buttons to a
# screen reader or to this driver.
#
# This flow exercises the ones that leave the sheet open: add as friend, mute,
# unmute, block, unblock.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "People in this group"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-members-section
- scrollUntilVisible:
    element:
      text: "Options for ${NAME}"
    direction: DOWN
    timeout: 30000
- tapOn: "Options for ${NAME}"
- extendedWaitUntil:
    visible: "Add as friend ${NAME}"
    timeout: 15000
- assertVisible: "Mute ${NAME}"
- assertVisible: "Block ${NAME}"
- takeScreenshot: ${SHOT}-member-actions
- tapOn: "Add as friend ${NAME}"
- extendedWaitUntil:
    visible: "Request sent ${NAME}"
    timeout: 20000
- takeScreenshot: ${SHOT}-friend-requested
- tapOn: "Mute ${NAME}"
- extendedWaitUntil:
    visible: "Unmute ${NAME}"
    timeout: 20000
- takeScreenshot: ${SHOT}-muted
- tapOn: "Unmute ${NAME}"
- extendedWaitUntil:
    visible: "Mute ${NAME}"
    timeout: 20000
- tapOn: "Block ${NAME}"
- extendedWaitUntil:
    visible: "Unblock ${NAME}"
    timeout: 20000
- takeScreenshot: ${SHOT}-blocked
- tapOn: "Unblock ${NAME}"
- extendedWaitUntil:
    visible: "Block ${NAME}"
    timeout: 20000
- takeScreenshot: ${SHOT}-unblocked
- tapOn: "Close dialog"
- runFlow:
    when:
      visible: "Close dialog"
    commands:
      - tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
