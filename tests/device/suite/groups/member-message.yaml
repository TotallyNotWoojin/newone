appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 50), v3.4: "Message" in a member's sheet opens the one-to-one
# chat with them. The action names the person, so it can never be confused with
# the composer's own "Write a message…" placeholder.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Options for ${NAME}"
    direction: DOWN
    timeout: 30000
- tapOn: "Options for ${NAME}"
- extendedWaitUntil:
    visible: "Add as friend ${NAME}"
    timeout: 15000
- takeScreenshot: ${SHOT}-member-actions
- tapOn: "Message ${NAME}"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 15000
- assertVisible: ".*${NAME}.*"
- assertNotVisible: ".*${GROUP}.*"
- takeScreenshot: ${SHOT}-direct-chat
