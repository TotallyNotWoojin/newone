appId: com.totallynotwoojin.newone
---
# v3.4: roles live in the member's own sheet with everything else about them.
# Controls → "Options for <name>" → the "ROLE · NAME" chip → close → the system
# row "… had their role changed."
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Options for ${NAME}"
    direction: DOWN
    timeout: 30000
- tapOn: "Options for ${NAME}"
- extendedWaitUntil:
    visible: "${ROLE} · ${NAME}"
    timeout: 15000
- takeScreenshot: ${SHOT}-before
- tapOn: "${ROLE} · ${NAME}"
- extendedWaitUntil:
    visible:
      text: "${ROLE} · ${NAME}"
      selected: true
    timeout: 20000
- takeScreenshot: ${SHOT}-after
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*had their role changed.*"
    timeout: 30000
