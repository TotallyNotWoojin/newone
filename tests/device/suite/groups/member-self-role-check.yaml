appId: com.totallynotwoojin.newone
---
# A plain member opens the controls: no role chips for anyone (including
# self), no Remove buttons, no Add a member section.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Members"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-members-as-member
- assertNotVisible: "Owner · ${SELF}"
- assertNotVisible: "Admin · ${SELF}"
- assertNotVisible: "Member · ${SELF}"
- assertNotVisible: "Remove ${OTHER}"
- assertNotVisible: "Add selected member"
- scrollUntilVisible:
    element:
      text: ".*(Leave this group|Archive conversation|Report this group privately).*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: ${SHOT}-bottom-as-member
- tapOn: "Close dialog"
