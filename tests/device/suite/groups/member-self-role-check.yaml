appId: com.totallynotwoojin.newone
---
# A plain member opens the controls: no "Add people" section, and the member
# sheet offers Message / Add as friend / Mute / Block but never the role chips
# and never "Remove from group" — those belong to owners and admins.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "People in this group"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-people-as-member
- assertNotVisible: "Add to group"
# The members list moved above "Add people" in v3.4, so the row for OTHER can
# sit below the fold even once the heading is on screen.
- scrollUntilVisible:
    element:
      text: "Options for ${OTHER}"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 30000
- tapOn: "Options for ${OTHER}"
- extendedWaitUntil:
    visible: "Add as friend ${OTHER}"
    timeout: 15000
- assertVisible: "Mute ${OTHER}"
- assertVisible: "Block ${OTHER}"
- assertNotVisible: "Remove from group ${OTHER}"
- assertNotVisible: "Owner · ${OTHER}"
- assertNotVisible: "Member · ${OTHER}"
- takeScreenshot: ${SHOT}-member-actions-as-member
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# "Report this group privately" was removed with the Sep 2026 chat stream; the
# sheet ends with Leave this group (members) or Archive conversation (managers).
- scrollUntilVisible:
    element:
      text: ".*(Leave this group|Archive conversation).*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: ${SHOT}-bottom-as-member
- tapOn: "Close dialog"
