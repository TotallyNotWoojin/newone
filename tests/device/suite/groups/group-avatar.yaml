appId: com.totallynotwoojin.newone
---
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# v3.4: the group's picture lives behind "Edit group details".
- scrollUntilVisible:
    element:
      text: "Edit group details"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Edit group details"
- scrollUntilVisible:
    element:
      text: "Choose group photo"
    direction: DOWN
    timeout: 30000
- tapOn: "Choose group photo"
- tapOn:
    text: "Allow Full Access"
    optional: true
- extendedWaitUntil:
    visible: ".*(Photos|Recents|Albums|Photo, ).*"
    timeout: 30000
# The first sample photo in the simulator library is HEIC, which the simulator
# cannot decode (expo-image-manipulator fails closed); the next ones are JPEG.
- tapOn:
    text: "Photo, .*"
    index: 1
    optional: true
# The picker opens with editing enabled: iOS shows a preview with Choose
# before returning the image (groups-20, run-2026-09-04T06-44-28).
- tapOn:
    text: "Choose"
    optional: true
- extendedWaitUntil:
    visible: "Upload and use photo"
    timeout: 30000
- tapOn: "Upload and use photo"
- extendedWaitUntil:
    visible: "Change photo"
    timeout: 90000
- takeScreenshot: ${SHOT}-avatar-set
- tapOn: "Close dialog"
