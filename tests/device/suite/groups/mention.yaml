appId: com.totallynotwoojin.newone
---
# Composer → Mention people → pick NAME → type → send.
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
# The chip renders an icon plus its label as one node on iOS 26.
- tapOn: ".*Mention people.*"
- extendedWaitUntil:
    visible: "Available members"
    timeout: 15000
- takeScreenshot: ${SHOT}-mention-picker
- tapOn:
    text: ".*${NAME}.*"
    below: "Available members"
- extendedWaitUntil:
    visible: ".*Selected: ${NAME}.*"
    timeout: 15000
- tapOn: ".*Close mentions.*"
- tapOn:
    id: "composer-input"
- inputText: ${TEXT}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${TEXT}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-mention-sent
