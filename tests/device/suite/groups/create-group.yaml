appId: com.totallynotwoojin.newone
---
# Chats → Start a conversation → name → find the MEMBER(s) through the picker's
# people search → Create. Anyone can be added (Sep 2026 social stream): the
# picker lists the people this account already knows and finds everyone else
# by name or @username, so MEMBERn_QUERY is what gets typed (the @username)
# and "Add MEMBERn" is the row that must appear.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Start a conversation"
    commands:
      - tapOn: "Chats"
- tapOn: "Start a conversation"
- extendedWaitUntil:
    visible: "Create a group"
    timeout: 20000
- tapOn:
    text: "Group name"
    index: 1
- inputText: ${NAME}
- tapOn: "Create a group"
# Typing the name leaves the keyboard up over the people section. The form is
# a sheet: a downward drag pulls it closed (chat-17a, run-2026-09-06T08-42-36),
# so the keyboard goes away with a tap on the "Group name" caption, and
# hideKeyboard is the fallback.
- tapOn:
    text: "Group name"
    index: 0
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible: "Create a group"
- takeScreenshot: ${SHOT}-details
# Consumer groups are private and invite-only (owner backlog v2): no group
# type, unit scope, or join policy controls on the form.
- assertNotVisible: "Organization-wide"
- assertNotVisible: "Organization unit scope"
- assertNotVisible: "Use company default"
- assertNotVisible: "Request approval"
- scrollUntilVisible:
    element:
      text: "Search by name or @username"
    direction: DOWN
    timeout: 45000
- tapOn: "Search by name or @username"
- inputText: ${MEMBER1_QUERY}
# No drags on this sheet (they pull it closed): a caption tap puts the
# keyboard away, hideKeyboard is the fallback.
- tapOn:
    text: "Group name"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- scrollUntilVisible:
    element:
      text: "Add ${MEMBER1}"
    direction: DOWN
    timeout: 30000
- tapOn: "Add ${MEMBER1}"
- runFlow:
    when:
      true: ${HAS_MEMBER2}
    commands:
      - tapOn: "Clear search"
      - tapOn: "Search by name or @username"
      - inputText: ${MEMBER2_QUERY}
      # No drags on this sheet (they pull it closed): caption tap, then hideKeyboard.
      - tapOn:
          text: "Group name"
          index: 0
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow:
          when:
            visible: "(.*(Typing Predictions|Dictate).*|space)"
          commands:
            - hideKeyboard:
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - scrollUntilVisible:
          element:
            text: "Add ${MEMBER2}"
          direction: DOWN
          timeout: 30000
      - tapOn: "Add ${MEMBER2}"
- takeScreenshot: ${SHOT}-people-selected
- tapOn: "Create"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 40000
- assertVisible: ${NAME}
- takeScreenshot: ${SHOT}-group-open
