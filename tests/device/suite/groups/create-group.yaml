appId: com.totallynotwoojin.newone
---
# Chats → Start a conversation → name → find the MEMBER(s) through the picker's
# people search → Create. Anyone can be added (Sep 2026 social stream): the
# picker lists the people this account already knows and finds everyone else
# by name or @username, so MEMBERn_QUERY is what gets typed (the @username)
# and "Add MEMBERn" is the row that must appear.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Start a conversation"
    commands:
      - tapOn: "Chats"
- tapOn: "Start a conversation"
- extendedWaitUntil:
    visible: "Create a group"
    timeout: 20000
- tapOn:
    text: "Group name"
    index: 1
- inputText: ${NAME}
- tapOn: "Create a group"
# Typing the name leaves the keyboard up over the people section (the consumer
# form has no "GROUP SETUP" eyebrow to tap any more). iOS 26.5 keyboards without
# the prediction bar defeat the text guard (neg-06, run-2026-09-04T14-27-52);
# ask iOS to hide it first, then fall back to the drag.
# Drag a little to dismiss the keyboard (hideKeyboard fails on iOS while a
# spelling callout is up).
- swipe:
    start: "50%, 45%"
    end: "50%, 55%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- takeScreenshot: ${SHOT}-details
# Consumer groups are private and invite-only (owner backlog v2): no group
# type, unit scope, or join policy controls on the form.
- assertNotVisible: "Organization-wide"
- assertNotVisible: "Organization unit scope"
- assertNotVisible: "Use company default"
- assertNotVisible: "Request approval"
- scrollUntilVisible:
    element:
      text: "Search by name or @username"
    direction: DOWN
    timeout: 45000
- tapOn: "Search by name or @username"
- inputText: ${MEMBER1_QUERY}
# Drag a little to dismiss the keyboard (hideKeyboard fails on iOS while a
# spelling callout is up).
- swipe:
    start: "50%, 45%"
    end: "50%, 55%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: "Add ${MEMBER1}"
    direction: DOWN
    timeout: 30000
- tapOn: "Add ${MEMBER1}"
- runFlow:
    when:
      true: ${HAS_MEMBER2}
    commands:
      - tapOn: "Clear search"
      - tapOn: "Search by name or @username"
      - inputText: ${MEMBER2_QUERY}
      # Drag a little to dismiss the keyboard (hideKeyboard fails on iOS while a
# spelling callout is up).
- swipe:
    start: "50%, 45%"
    end: "50%, 55%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
      - runFlow:
          when:
            visible: "(.*(Typing Predictions|Dictate).*|space)"
          commands:
            - swipe:
                start: "50%, 30%"
                end: "50%, 88%"
                duration: 600
      - scrollUntilVisible:
          element:
            text: "Add ${MEMBER2}"
          direction: DOWN
          timeout: 30000
      - tapOn: "Add ${MEMBER2}"
- takeScreenshot: ${SHOT}-people-selected
- tapOn: "Create"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 40000
- assertVisible: ${NAME}
- takeScreenshot: ${SHOT}-group-open
