appId: com.totallynotwoojin.newone
---
# Controls → "Leave this group" → tick "I understand" (the long acknowledgement
# sentence was shortened in the Sep 2026 terminology pass) → "Leave group".
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# v3.5: leaving is a row that opens its own sheet, so the acknowledgement and
# the button are at the top of a short one rather than below the fold of a long
# one — which is where three runs on Sep 9 2026 lost this step.
- scrollUntilVisible:
    element:
      text: "Leave this group"
    direction: DOWN
    timeout: 30000
- tapOn: "Leave this group"
- extendedWaitUntil:
    visible: "I understand"
    timeout: 15000
- takeScreenshot: ${SHOT}-leave-section
- tapOn: "I understand"
- extendedWaitUntil:
    visible: "Leave group"
    timeout: 15000
- tapOn: "Leave group"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 30000
- takeScreenshot: ${SHOT}-after-leave
