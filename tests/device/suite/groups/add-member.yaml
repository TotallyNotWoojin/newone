appId: com.totallynotwoojin.newone
---
# Controls → Add a member → search NAME → Search members → pick → Add.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Search the company directory"
    direction: DOWN
    timeout: 30000
- tapOn: "Search the company directory"
- inputText: ${NAME}
- tapOn: "Add a member"
- tapOn: "Search members"
- extendedWaitUntil:
    visible: ".*(${NAME}|No eligible members).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-candidates
- tapOn:
    text: ${NAME}
    index: 0
- tapOn: "Add selected member"
- extendedWaitUntil:
    notVisible: "Add selected member"
    timeout: 20000
    optional: true
- takeScreenshot: ${SHOT}-added
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*was added to the conversation.*"
    timeout: 30000
- takeScreenshot: ${SHOT}-system-row
