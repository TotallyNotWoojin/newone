appId: com.totallynotwoojin.newone
---
# Controls → "Add people" → type QUERY (the person's @username) into "Name or
# @username" → "Search people" → pick the NAME row → "Add to group" → the
# system row "… was added to the group." appears in the thread.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# v3.5: "Add people" is a row that opens the form, not a form standing open.
- scrollUntilVisible:
    element:
      text: "Add people"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 30000
- tapOn: "Add people"
- scrollUntilVisible:
    element:
      text: "Name or @username"
    direction: DOWN
    timeout: 30000
- tapOn: "Name or @username"
- inputText: ${QUERY}
- tapOn: "Add people"
- tapOn: "Search people"
# Strictly the candidate: an "or No one matched" wait passed even when the
# picker offered nobody, and the step then tapped the roster row of the same
# person further down the sheet and added no one at all.
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 30000
- assertNotVisible: "No one matched that search."
- takeScreenshot: ${SHOT}-candidates
# v3.1 (backlog 14): the candidate row carries the person's @handle under the name.
# Optional until migration 20260907020000 ships (held behind the v3.1 client
# floor, backlog 22): without it the server sends no username.
- extendedWaitUntil:
    visible: ".*@${QUERY}.*"
    timeout: 10000
    optional: true
# Candidate rows are merged accessibility nodes (initials + name); select the
# row between the search button and "Add to group", so neither the search field
# above it nor the group's own roster below it is ever the target.
- tapOn:
    text: ".*${NAME}.*"
    above: "Add to group"
    below: "Search people"
- tapOn: "Add to group"
- extendedWaitUntil:
    notVisible: "Add to group"
    timeout: 20000
    optional: true
- takeScreenshot: ${SHOT}-added
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*was added to the group.*"
    timeout: 30000
- takeScreenshot: ${SHOT}-system-row
