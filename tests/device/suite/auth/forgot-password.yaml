appId: com.totallynotwoojin.newone
---
# From the password step, "Forgot password?" emails a recovery code and shows
# the code screen. (The harness mints the code through the admin API when
# NEWONE_DEVICE_MINT_CODES=1; the app verifies it like an emailed code.)
- extendedWaitUntil:
    visible:
      id: "password"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "forgot-password"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "forgot-password"
- extendedWaitUntil:
    visible: "(One-time code|.*could not.*|.*Too many.*|.*unavailable.*|.*cannot reach.*)"
    timeout: 30000
- takeScreenshot: ${SHOT}-forgot-code-screen
- assertVisible: "One-time code"
- assertNotVisible:
    id: "password"
