appId: com.totallynotwoojin.newone
---
# "Set a new password" after the recovery code: type the password (field id
# "new-password"), Save password, land on Chats signed in. The password is
# written through the recovering session, which stays valid (defect AF).
# Env: PASSWORD.
- assertVisible: "Set a new password"
# Reveal the field so the typed password can be checked on screen.
- tapOn:
    text: "Show password"
    optional: true
- tapOn:
    id: "new-password"
- eraseText: 60
- inputText: ${PASSWORD}
# "New password" names the caption first, then the input; the caption tap
# commits the field and puts the keyboard away.
- tapOn:
    text: "New password"
    index: 0
    optional: true
- runFlow:
    when:
      notVisible: "${PASSWORD}"
    commands:
      - tapOn:
          id: "new-password"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 60
      - inputText: ${PASSWORD}
      - tapOn:
          text: "New password"
          index: 0
          optional: true
- assertVisible: "${PASSWORD}"
- takeScreenshot: ${SHOT}-new-password-typed
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- scrollUntilVisible:
    element:
      text: "Save password"
    direction: DOWN
    timeout: 15000
- tapOn: "Save password"
- extendedWaitUntil:
    visible: "(Chats|채팅|.*Use at least.*|.*could not.*|.*Too many.*)"
    timeout: 45000
- assertVisible: "Chats"
# The first-launch notification card may sit on top of the list; answer it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Not now"
    optional: true
- takeScreenshot: ${SHOT}-new-password-signed-in
