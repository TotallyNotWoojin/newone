appId: com.totallynotwoojin.newone
---
# On the password step, a wrong password is refused with a visible, specific
# message and the member stays on the password step. Env: PASSWORD (a wrong one).
- extendedWaitUntil:
    visible:
      id: "password"
    timeout: 15000
- tapOn:
    id: "password"
- eraseText: 60
- inputText: ${PASSWORD}
# The caption tap puts the keyboard away; hideKeyboard is the fallback.
- tapOn:
    text: "Password"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- scrollUntilVisible:
    element:
      text: "Sign in"
    direction: DOWN
    timeout: 15000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: ".*(That email or password is incorrect|Too many|could not).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-wrong-password
- assertVisible: "That email or password is incorrect."
- assertNotVisible: "Chats"
- assertVisible:
    id: "password"
