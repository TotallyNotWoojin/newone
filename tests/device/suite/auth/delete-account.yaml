appId: com.totallynotwoojin.newone
---

- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Permanently deletes your account, sign-in, and data from Newone."
    direction: DOWN
    timeout: 60000
    centerElement: true
- takeScreenshot: ${SHOT}-danger-zone
# "Delete account" appears three times: the section title, the row label, and
# the button below the note. Centring the note keeps the button on screen
# (run-2026-09-04T12-04-44: the note sat at the bottom edge and the tap missed).
- scrollUntilVisible:
    element:
      text: "Delete account"
      index: 2
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Delete account"
    index: 2
- extendedWaitUntil:
    visible: "Permanently delete this account"
    timeout: 15000
- takeScreenshot: ${SHOT}-delete-dialog
# The dialog asks for the literal word DELETE (placeholder "DELETE").
- tapOn: "DELETE"
- inputText: "DELETE"
- tapOn: "Type DELETE to enable deletion"
- takeScreenshot: ${SHOT}-confirmation-typed
- tapOn: "Delete account permanently"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 40000
- takeScreenshot: ${SHOT}-back-at-sign-in
