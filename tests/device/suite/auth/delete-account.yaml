appId: com.totallynotwoojin.newone
---

- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
# "Delete account" is the one row of the "Danger" group at the bottom of the
# screen (the explanatory note is gone). Centring the row keeps it clear of the
# bottom edge (run-2026-09-04T12-04-44: a tap at the edge missed).
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
    timeout: 60000
    centerElement: true
- takeScreenshot: ${SHOT}-danger-zone
- tapOn: "Delete account"
- extendedWaitUntil:
    visible: "Permanently delete this account"
    timeout: 15000
- takeScreenshot: ${SHOT}-delete-dialog
# The field asks for the account's username (its placeholder is the username)
# or, when the signed-in identity carries no username, the literal word DELETE.
- runFlow:
    when:
      visible: "Type DELETE to enable deletion"
    commands:
      - tapOn: "DELETE"
      - inputText: "DELETE"
      - tapOn: "Type DELETE to enable deletion"
- runFlow:
    when:
      visible: "Type your username to enable deletion"
    commands:
      - tapOn: "${USERNAME}"
      - inputText: ${USERNAME}
      - tapOn: "Type your username to enable deletion"
- takeScreenshot: ${SHOT}-confirmation-typed
- tapOn: "Delete account permanently"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 40000
- takeScreenshot: ${SHOT}-back-at-sign-in
