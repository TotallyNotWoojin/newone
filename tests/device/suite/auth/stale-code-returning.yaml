appId: com.totallynotwoojin.newone
---
# After a resend, the superseded (old) code is entered. It must be refused.
- assertVisible: "One-time code"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "One-time code"
# Evidence of what was actually in the field before verifying (the consumed-code
# check once ended on an empty field with the six-digit hint and no error).
- takeScreenshot: ${SHOT}-code-typed
# On the forgot-password code step (v3.2) the button reads "Continue" (it was
# "Sign in" / "Verify and sign in" on the older returning code screen; both
# are accepted); the mode chips are hidden there, so the text is unique.
- scrollUntilVisible:
    element:
      text: "(Continue|Verify and sign in|Sign in)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue|Verify and sign in|Sign in)"
- extendedWaitUntil:
    visible: ".*(could not be verified|could not complete|expired|Check the entered|six-digit code|Too many|Chats|Set a new password).*"
    timeout: 40000
- takeScreenshot: ${SHOT}-stale-code-result
- assertNotVisible: "Chats"
- assertNotVisible: "Set a new password"
- assertVisible: "One-time code"
