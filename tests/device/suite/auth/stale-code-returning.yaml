appId: com.totallynotwoojin.newone
---
# After a resend, the superseded (old) code is entered. It must be refused.
- assertVisible: "One-time code"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "One-time code"
# Evidence of what was actually in the field before verifying (the consumed-code
# check once ended on an empty field with the six-digit hint and no error).
- takeScreenshot: ${SHOT}-code-typed
# The verify button reads "Sign in" (was "Verify and sign in"; older builds
# are accepted); on the code step the mode chips are hidden, so the text is
# unique.
- scrollUntilVisible:
    element:
      text: "(Verify and sign in|Sign in)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Verify and sign in|Sign in)"
- extendedWaitUntil:
    visible: ".*(could not be verified|could not complete|expired|Check the entered|six-digit code|Too many|Chats).*"
    timeout: 40000
- takeScreenshot: ${SHOT}-stale-code-result
- assertNotVisible: "Chats"
- assertVisible: "One-time code"
