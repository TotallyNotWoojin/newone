appId: com.totallynotwoojin.gist
---
# Send the pasted picture into the group. The chat marks itself read the
# moment the photo becomes its newest message, which used to erase the photo
# from the app's state (Sep 23 2026); it has to stay on screen through its
# upload and end up openable.
- tapOn:
    id: "attachment-send"
    retryTapIfNoChange: false
# Tap again only if the sheet is still up well after the first tap. A second
# tap that raced the sheet closing landed on the "Saving to 1. HDG" bar, which
# sits where Send was, and opened Projects over the chat (Android, Sep 23 2026).
- extendedWaitUntil:
    notVisible:
      id: "attachment-send"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "attachment-send"
    commands:
      - tapOn:
          id: "attachment-send"
          retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: "attachment-send"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*(Uploading|Upload progress|Preparing upload|Open image full screen).*"
    timeout: 60000
- assertNotVisible: "Retry upload"
