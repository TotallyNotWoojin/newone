appId: com.totallynotwoojin.newone
---
# Add attachment → Photo library → first photo → Send securely; the bubble
# shows the attachment card that reaches "Scanned and safe".
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn: "Add attachment"
- extendedWaitUntil:
    visible: "Photo library"
    timeout: 15000
- takeScreenshot: ${SHOT}-attachment-sheet
- tapOn: "Photo library"
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "Allow Access to All Photos"
    optional: true
- extendedWaitUntil:
    visible: ".*(Photos|Recents|Albums|Photo, ).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-picker
# The first sample photo in the simulator library is HEIC, which the simulator
# cannot decode (expo-image-manipulator fails closed); the next ones are JPEG.
- tapOn:
    text: "Photo, .*"
    index: 1
    optional: true
- extendedWaitUntil:
    visible: "(Send securely|Send)"
    timeout: 30000
- takeScreenshot: ${SHOT}-staged
- tapOn: "(Send securely|Send)"
- extendedWaitUntil:
    notVisible: "(Send securely|Send)"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*(Scanned and safe|Ready|Security scan in progress|Uploading|Quarantined for scanning|Uploading securely|Preparing secure upload).*"
    timeout: 60000
- takeScreenshot: ${SHOT}-sending
- extendedWaitUntil:
    visible: "(Scanned and safe|Ready)"
    timeout: 120000
- takeScreenshot: ${SHOT}-clean
