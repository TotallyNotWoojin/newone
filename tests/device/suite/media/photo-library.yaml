appId: com.totallynotwoojin.newone
---
# Add attachment → Photo library → first photo → Send; the bubble is the photo
# itself: dimmed under a progress ring while uploading, then tappable with the
# accessibility label "Open image full screen" (no file card for photos).
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
# A keyboard left up by the previous step stays up under the attachment sheet
# and hides its Send button (the driver still reports the button visible).
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn: "Add attachment"
- extendedWaitUntil:
    visible: "Photo library"
    timeout: 15000
- takeScreenshot: ${SHOT}-attachment-sheet
- tapOn: "Photo library"
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "Allow Access to All Photos"
    optional: true
- extendedWaitUntil:
    visible: ".*(Photos|Recents|Albums|Photo, ).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-picker
# The first sample photo in the simulator library is HEIC, which the simulator
# cannot decode (expo-image-manipulator fails closed); the next ones are JPEG.
- tapOn:
    text: "Photo, .*"
    index: 1
    optional: true
- extendedWaitUntil:
    visible: "(Send securely|Send)"
    timeout: 30000
- takeScreenshot: ${SHOT}-staged
# The sheet is still settling when Send first reports visible; a tap on a
# moving button misses (chat area, third pass). Let it settle, then retry once.
- waitForAnimationToEnd:
    timeout: 3000
# "Send" by text can resolve to the composer's own send button behind the
# sheet when a draft is present (v3-06a, run-2026-09-06T16-16-36), and that
# tap does nothing. The sheet's button carries an id from v3.1 on; text is
# the fallback for older builds.
- runFlow:
    when:
      visible:
        id: "attachment-send"
    commands:
      - tapOn:
          id: "attachment-send"
# Text fallback only for builds without the id: both conditions must hold,
# otherwise this ran after a successful id tap had already closed the sheet
# (v3-06a, run-2026-09-06T18-03-43) and failed on the missing text.
- runFlow:
    when:
      notVisible:
        id: "attachment-send"
      visible: "(Send securely|Send)"
    commands:
      - tapOn: "(Send securely|Send)"
- extendedWaitUntil:
    notVisible: "(Send securely|Send)"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "attachment-send"
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: "attachment-send"
- extendedWaitUntil:
    notVisible: "(Send securely|Send)"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*(Open image full screen|Uploading|Upload progress|Preparing upload).*"
    timeout: 60000
- takeScreenshot: ${SHOT}-sending
- extendedWaitUntil:
    visible: "Open image full screen"
    timeout: 120000
- takeScreenshot: ${SHOT}-clean
