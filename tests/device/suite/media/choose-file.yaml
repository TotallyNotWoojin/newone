appId: com.totallynotwoojin.newone
---
# Add attachment → Choose file → the system document picker; pick the first
# document if the simulator offers one, otherwise cancel (reported).
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn: "Add attachment"
- extendedWaitUntil:
    visible: "Choose file"
    timeout: 15000
- tapOn: "Choose file"
- extendedWaitUntil:
    visible: ".*(Recents|Browse|On My iPhone|iCloud Drive|Cancel).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-document-picker
# The suite seeds newone-sample.pdf/.txt into each simulator's Files storage
# ("On My iPhone"). The picker opens on Recents, which is empty on a fresh
# simulator, so browse to the local location first when the file is not listed.
- runFlow:
    when:
      notVisible: ".*newone-sample.*"
    commands:
      - runFlow:
          when:
            visible: "Browse"
          commands:
            - tapOn: "Browse"
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible: ".*On My iPhone.*"
          commands:
            - tapOn: ".*On My iPhone.*"
            - waitForAnimationToEnd:
                timeout: 2000
- extendedWaitUntil:
    visible: ".*newone-sample.*"
    timeout: 15000
- takeScreenshot: ${SHOT}-document-list
- tapOn:
    text: ".*newone-sample.*"
    index: 0
- extendedWaitUntil:
    visible: "(Send securely|Send)"
    timeout: 30000
- tapOn: "(Send securely|Send)"
- extendedWaitUntil:
    visible: ".*(Scanned and safe|Ready).*"
    timeout: 120000
- takeScreenshot: ${SHOT}-document-sent
