appId: com.totallynotwoojin.newone
---
# Add attachment → Choose file → the system document picker; pick the first
# document if the simulator offers one, otherwise cancel (reported).
- extendedWaitUntil:
    visible: "Write a message…"
    timeout: 20000
- tapOn: "Add attachment"
- extendedWaitUntil:
    visible: "Choose file"
    timeout: 15000
- tapOn: "Choose file"
- extendedWaitUntil:
    visible: ".*(Recents|Browse|On My iPhone|iCloud Drive|Cancel).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-document-picker
- tapOn:
    text: ".*(\\.pdf|\\.txt|\\.png|\\.jpg|\\.md|\\.json).*"
    index: 0
- extendedWaitUntil:
    visible: "Send securely"
    timeout: 30000
- tapOn: "Send securely"
- extendedWaitUntil:
    visible: "Scanned and safe"
    timeout: 120000
- takeScreenshot: ${SHOT}-document-sent
