---
- extendedWaitUntil:
    visible: ".*(Voice message|voice-note-).*"
    timeout: 90000
- extendedWaitUntil:
    visible: "Play voice message"
    timeout: 120000
- tapOn: "Play voice message"
- extendedWaitUntil:
    visible: "Pause voice message"
    timeout: 15000
- takeScreenshot: ${SHOT}-playing
