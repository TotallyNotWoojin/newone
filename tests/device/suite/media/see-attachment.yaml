appId: com.totallynotwoojin.newone
---
# Peer sees the attachment card and can open it.
- extendedWaitUntil:
    visible: ".*(Scanned and safe|Ready|Security scan in progress|Uploading).*"
    timeout: 90000
- extendedWaitUntil:
    visible: "(Scanned and safe|Ready)"
    timeout: 120000
- takeScreenshot: ${SHOT}-peer-sees
- tapOn:
    text: ".*Scanned and safe.*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Done|Newone|Write a message…|Cancel|Share).*"
    timeout: 20000
- takeScreenshot: ${SHOT}-opened
