appId: com.totallynotwoojin.newone
---
# From anywhere: open Settings → Edit profile and remove the profile photo.
# (The first run started on Chats after the previous step closed Settings,
# run-15-28-42.)
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 30000
- tapOn: "Remove photo"
- extendedWaitUntil:
    notVisible: "Remove photo"
    timeout: 30000
- takeScreenshot: ${SHOT}-photo-removed
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
