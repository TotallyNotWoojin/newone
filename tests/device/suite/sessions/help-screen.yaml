appId: com.totallynotwoojin.newone
---
# Settings → Help → back.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
    timeout: 45000
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help and recovery"
    timeout: 15000
- assertVisible: "Creating your account"
- takeScreenshot: ${SHOT}-help
- tapOn: "Close help"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- tapOn: "Close settings"
