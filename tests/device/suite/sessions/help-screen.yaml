appId: com.totallynotwoojin.newone
---
# Settings → Help, recovery, and safety → back.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Help, recovery, and safety"
    direction: DOWN
    timeout: 45000
- tapOn: "Help, recovery, and safety"
- extendedWaitUntil:
    visible: "Help and recovery"
    timeout: 15000
- assertVisible: "Creating your account"
- takeScreenshot: ${SHOT}-help
- tapOn: "Close help"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- tapOn: "Close settings"
