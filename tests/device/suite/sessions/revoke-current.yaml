appId: com.totallynotwoojin.newone
---
# Ending the current device's own session from Settings. Consumer accounts have
# no "Revoke this session" control (settings.tsx renders that RowAction only
# for workplace organizations, !personalRealm); the consumer path is
# "Sign out of Newone", which revokes this session on the server before
# signing out locally.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Devices"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-devices
- scrollUntilVisible:
    element:
      text: "Sign out of Newone"
    direction: DOWN
    timeout: 45000
- tapOn: "Sign out of Newone"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 40000
- takeScreenshot: ${SHOT}-signed-out
