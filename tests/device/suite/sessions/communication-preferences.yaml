appId: com.totallynotwoojin.newone
---
# Settings → General → Read receipts picker → Nobody; Notifications → Sound
# off. Account settings save themselves (no Save button, no "saved" text): the
# picker's selected state on reopen and the absence of the error banner are
# the evidence. Then both are restored.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
# The rows stay disabled until the account settings have loaded.
- extendedWaitUntil:
    visible:
      text: "Read receipts"
      enabled: true
    timeout: 30000
- takeScreenshot: ${SHOT}-preferences
- tapOn: "Read receipts"
- extendedWaitUntil:
    visible: "Read receipts: Nobody"
    timeout: 15000
- tapOn: "Read receipts: Nobody"
- extendedWaitUntil:
    notVisible: "Read receipts: Nobody"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Sound"
    direction: DOWN
    timeout: 30000
# Label text first in the hierarchy, then the Switch with the same label.
- tapOn:
    text: "Sound"
    index: 1
- extendedWaitUntil:
    notVisible: ".*(could not|cannot|failed).*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Read receipts"
    direction: UP
    timeout: 30000
- tapOn: "Read receipts"
- extendedWaitUntil:
    visible: "Read receipts: Nobody"
    timeout: 15000
- assertVisible:
    text: "Read receipts: Nobody"
    selected: true
- takeScreenshot: ${SHOT}-saved
- tapOn: "Read receipts: Everyone"
- extendedWaitUntil:
    notVisible: "Read receipts: Everyone"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Sound"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Sound"
    index: 1
- extendedWaitUntil:
    notVisible: ".*(could not|cannot|failed).*"
    timeout: 10000
- tapOn: "Close settings"
