appId: com.totallynotwoojin.newone
---
# Settings → Communication preferences: read receipts → Nobody, sound off,
# save; then back to Everyone.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*(Changes are saved automatically|Saving…).*"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-preferences
- tapOn: ".*Read receipt visibility: Nobody.*"
- tapOn: ".*Notification preview: Hidden and silent.*"
- extendedWaitUntil:
    visible: ".*(Changes are saved automatically|Saving…).*"
    timeout: 15000
- extendedWaitUntil:
    notVisible: ".*(could not|cannot|failed).*"
    timeout: 10000
- takeScreenshot: ${SHOT}-saved
- tapOn: ".*Read receipt visibility: Everyone.*"
- extendedWaitUntil:
    visible: ".*(Changes are saved automatically|Saving…).*"
    timeout: 15000
- tapOn: "Close settings"
