appId: com.totallynotwoojin.newone
---
# Settings → Devices: the other device's row carries a "Sign out" action. For
# consumer accounts the dialog is "Sign out this device?" with "Yes, sign out"
# and no reason field (workplace organizations keep "Revoke and sign out").
- scrollUntilVisible:
    element:
      text: "Sign out"
    direction: DOWN
    timeout: 30000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Yes, sign out"
    timeout: 15000
- assertVisible: 'Sign out this device\?'
- takeScreenshot: ${SHOT}-sign-out-dialog
- tapOn: "Yes, sign out"
- extendedWaitUntil:
    notVisible: "Yes, sign out"
    timeout: 30000
- extendedWaitUntil:
    visible: "No other devices"
    timeout: 30000
- takeScreenshot: ${SHOT}-revoked
