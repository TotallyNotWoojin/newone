appId: com.totallynotwoojin.newone
---
# Settings → Edit profile → Choose photo → simulator photo library → the sheet
# offers "Remove photo" (the picture replaced the initials) and the server
# profile carries a path. Owner backlog v2: profile pictures.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
# The photo controls live in the Edit profile sheet, opened by the profile row.
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: "Choose photo"
    timeout: 15000
- takeScreenshot: ${SHOT}-before
- tapOn: "Choose photo"
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "Allow Access to All Photos"
    optional: true
- extendedWaitUntil:
    visible: ".*(Photos|Recents|Albums|Photo, ).*"
    timeout: 30000
- tapOn:
    text: "Photo, .*"
    index: 1
    optional: true
- tapOn:
    text: "Choose"
    optional: true
# The button shows a spinner while uploading; "Remove photo" appears once the
# uploaded picture is the profile avatar.
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 90000
- takeScreenshot: ${SHOT}-photo-set
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
