appId: com.totallynotwoojin.newone
---
# Settings → Devices must list the other device's session.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Devices"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-sessions
# The device rows sit below the group title; scroll to the other device's
# "Sign out" action rather than waiting for it where the title is.
- scrollUntilVisible:
    element:
      text: "Sign out"
    direction: DOWN
    timeout: 45000
- assertNotVisible: "No other devices"
- takeScreenshot: ${SHOT}-other-session-listed
