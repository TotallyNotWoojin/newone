appId: com.totallynotwoojin.newone
---
# New group → search the candidate list for a NON-friend's name. Expected:
# "No authorized candidates match this search." If the stranger appears,
# add them and try to create.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Start a conversation"
    commands:
      - tapOn: "Chats"
- tapOn: "Start a conversation"
- extendedWaitUntil:
    visible: "Create a group"
    timeout: 20000
- tapOn:
    text: "Group name"
    index: 1
- inputText: ${NAME}
- tapOn: "Create a group"
# Typing the name leaves the keyboard up over the member section; a tap on the
# search field then lands on the keys and the stranger's name is appended to
# the group name. Dismiss it first (see groups/create-group.yaml).
- tapOn: "GROUP SETUP"
# iOS 26.5 keyboards without the prediction bar defeat the text guard
# (neg-06, run-2026-09-04T14-27-52); ask iOS to hide it first.
- hideKeyboard
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: "(Search company directory|Search your friends)"
    direction: DOWN
    timeout: 30000
- tapOn: "(Search company directory|Search your friends)"
- inputText: ${STRANGER}
- tapOn: "MEMBERS"
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- extendedWaitUntil:
    visible: ".*(No authorized candidates match this search|Add ${STRANGER}).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-candidates
- assertVisible: "No authorized candidates match this search."
- tapOn: "Cancel group creation"
