appId: com.totallynotwoojin.newone
---
# Returning sign-in ("Sign in" mode chip — "Returning member" on older builds)
# with an email that has no account: the lookup says so plainly and offers to
# create one instead. No code screen, no password field. Env: EMAIL.
- launchApp
- extendedWaitUntil:
    visible: "(Returning member|Sign in)"
    timeout: 30000
- tapOn: "English"
- tapOn:
    text: "(Returning member|Sign in)"
    index: 0
- scrollUntilVisible:
    element:
      id: "sign-in-destination"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "sign-in-destination"
- tapOn:
    text: "Clear text"
    optional: true
- eraseText: 120
- inputText: ${EMAIL}
# The caption tap after typing commits the field on iOS; on Android the caption
# sits behind the keyboard and is not in the accessibility tree, so it is optional.
- tapOn:
    text: "Email address"
    index: 0
    optional: true
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible: ".*(no account|could not|cannot|unavailable|Too many).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-result
- assertVisible: "There’s no account with that email."
- assertVisible:
    id: "create-account-shortcut"
- assertNotVisible: "One-time code"
- assertNotVisible:
    id: "password"
