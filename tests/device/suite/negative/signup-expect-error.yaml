appId: com.totallynotwoojin.newone
---
# Fill the sign-up form with the given values and expect ERROR instead of
# the code screen.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*(Chats|Create account).*"
    timeout: 40000
- runFlow:
    when:
      visible: "Chats"
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element:
            text: "Sign out of Newone"
          direction: DOWN
          timeout: 45000
      - tapOn: "Sign out of Newone"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "English"
- tapOn: "Create account"
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
# The label tap after typing commits the field on iOS; on Android the label sits
# behind the keyboard and is not in the accessibility tree (android-v3-composer5:
# Tap on "Email address" not found), so it is optional there.
- tapOn:
    text: "Email address"
    optional: true
- scrollUntilVisible:
    element:
      text: "your_username"
    direction: DOWN
    timeout: 15000
- tapOn: "your_username"
- inputText: ${USERNAME}
- tapOn:
    text: "Username"
    optional: true
- scrollUntilVisible:
    element:
      text: "Your name as others will see it"
    direction: DOWN
    timeout: 15000
- tapOn: "Your name as others will see it"
- inputText: ${DISPLAY_NAME}
- tapOn:
    text: "Display name"
    optional: true
# Every account needs a password; without it the client blocks the request
# before the server can refuse the username.
- tapOn:
    text: "Password"
    index: 0
    optional: true
- scrollUntilVisible:
    element:
      id: "signup-password"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "signup-password"
- inputText: Newone-test-2026
- tapOn:
    text: "Password"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible: ${ERROR}
    timeout: 30000
- takeScreenshot: ${SHOT}-error
- assertNotVisible: "One-time code"
