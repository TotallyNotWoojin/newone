appId: com.totallynotwoojin.newone
---
# New group → search the picker for a stranger (STRANGER_QUERY is their
# @username). Consumers can add anyone (Sep 2026 social stream), so the
# stranger must be offered as "Add STRANGER"; the old "No authorized
# candidates match this search." refusal no longer exists. Nothing is created:
# the form is cancelled.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Start a conversation"
    commands:
      - tapOn: "Chats"
- tapOn: "Start a conversation"
- extendedWaitUntil:
    visible: "Create a group"
    timeout: 20000
- tapOn:
    text: "Group name"
    index: 1
- inputText: ${NAME}
- tapOn: "Create a group"
# Typing the name leaves the keyboard up over the people section; a tap on the
# search field then lands on the keys and the stranger's name is appended to
# the group name. Dismiss it first (see groups/create-group.yaml).
- hideKeyboard
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: "Search by name or @username"
    direction: DOWN
    timeout: 30000
- tapOn: "Search by name or @username"
- inputText: ${STRANGER_QUERY}
- hideKeyboard
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: "Add ${STRANGER}"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-candidates
- assertVisible: "Add ${STRANGER}"
- tapOn: "Cancel group creation"
