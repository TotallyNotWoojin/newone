appId: com.totallynotwoojin.newone
---
# From a search result: Send message request → first message → Send request
# → the new conversation opens with the pending banner.
- assertVisible: "Send message request"
- tapOn: "Send message request"
- extendedWaitUntil:
    visible: "Send request"
    timeout: 15000
- tapOn: ".*Introduce yourself.*"
- inputText: ${TEXT}
- tapOn: "First message"
- takeScreenshot: ${SHOT}-compose
- tapOn: "Send request"
- extendedWaitUntil:
    visible: ".*Request pending.*"
    timeout: 30000
- assertVisible: ${TEXT}
- takeScreenshot: ${SHOT}-pending-conversation
