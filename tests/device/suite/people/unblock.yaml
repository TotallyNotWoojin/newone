appId: com.totallynotwoojin.newone
---
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Contacts"
- extendedWaitUntil:
    visible: "Blocked"
    timeout: 30000
- tapOn: "Manage contact and privacy"
- extendedWaitUntil:
    visible: "Unblock this person"
    timeout: 15000
- tapOn: "Unblock this person"
- extendedWaitUntil:
    visible: "Block this person"
    timeout: 20000
- tapOn: "Close dialog"
- extendedWaitUntil:
    notVisible: "Blocked"
    timeout: 15000
- takeScreenshot: ${SHOT}-unblocked
