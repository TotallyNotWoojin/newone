appId: com.totallynotwoojin.newone
---
# People → friend card → Remove connection; the friend disappears.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "People"
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Remove connection"
    direction: DOWN
    timeout: 30000
- tapOn: "Remove connection"
- extendedWaitUntil:
    notVisible: ${NAME}
    timeout: 20000
- assertVisible: "No friends yet"
- takeScreenshot: ${SHOT}-removed
