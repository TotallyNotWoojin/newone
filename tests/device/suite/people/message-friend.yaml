appId: com.totallynotwoojin.newone
---
# From People, tap Message on the friend card, then send a text.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "People"
- scrollUntilVisible:
    element:
      text: "Message"
    direction: DOWN
    timeout: 30000
- tapOn: "Message"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn:
    id: "composer-input"
- inputText: ${TEXT}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${TEXT}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-sent
