appId: com.totallynotwoojin.newone
---
# The recipient sees the incoming connect request under People → Requests.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Requests"
    timeout: 60000
- assertVisible: ${NAME}
- assertVisible: "Accept"
- assertVisible: "Decline"
- takeScreenshot: ${SHOT}-requests
