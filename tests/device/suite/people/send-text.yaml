appId: com.totallynotwoojin.newone
---
# Open the conversation with PEER and send TEXT; it must render as sent (no
# failure marker).
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: ".*${PEER}.*"
    commands:
      - tapOn: "Chats"
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 30000
# The status banner (Reconnecting…/Offline…) shows briefly after launch and the
# list shifts up when it clears; a tap aimed at a row then lands on the row
# below it (a request row's Decline button, run-2026-09-04T20-41-40). Let the
# banner clear and the list settle before touching a row.
- extendedWaitUntil:
    notVisible: ".*(Reconnecting and checking|Reconectando y|재연결하고|Offline · |Sin conexión · |오프라인 · |Loading…|Cargando…|불러오는 중).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- tapOn:
    id: "composer-input"
- eraseText: 60
- inputText: ${TEXT}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${TEXT}.*"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Not sent"
    timeout: 15000
- takeScreenshot: ${SHOT}-sent
