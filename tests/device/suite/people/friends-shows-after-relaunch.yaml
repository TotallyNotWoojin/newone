appId: com.totallynotwoojin.newone
---
# Fallback: force-quit + relaunch, then check the Contacts tab lists NAME under
# "Your people" (used when the live update did not arrive on its own in time).
- stopApp
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
- tapOn: "Contacts"
- extendedWaitUntil:
    visible: "Your people"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*${NAME}.*"
    direction: DOWN
    timeout: 30000
- assertVisible: "Message"
- takeScreenshot: ${SHOT}-person-after-relaunch
