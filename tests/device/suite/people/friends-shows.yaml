appId: com.totallynotwoojin.newone
---
# The requester's People tab must show the new friend (no relaunch first —
# the app should learn of the acceptance on its own).
# The device may still be inside a conversation from the previous step
# (people-12c, run-2026-09-04T07-43-xx): leave it before using the tabs.
- runFlow:
    when:
      visible: "(Back to chats|Volver a chats)"
    commands:
      - tapOn: "(Back to chats|Volver a chats)"
- tapOn: "Chats"
- tapOn: "People"
- extendedWaitUntil:
    visible: "Your friends"
    timeout: 15000
# The friend card sits below the Requests section; scroll to its Message button.
- scrollUntilVisible:
    element:
      text: "Message"
    direction: DOWN
    timeout: 45000
- assertVisible: ${NAME}
- takeScreenshot: ${SHOT}-friend-visible
