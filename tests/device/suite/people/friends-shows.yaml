appId: com.totallynotwoojin.newone
---
# The People tab lists NAME under "Your people" (everyone this account has
# chatted with) with a Message button — no relaunch first, the app should
# learn of the new chat on its own. The friends/requests sections are gone
# since the Sep 2026 social stream.
# The device may still be inside a conversation from the previous step
# (people-12c, run-2026-09-04T07-43-xx): leave it before using the tabs.
- runFlow:
    when:
      visible: "(Back to chats|Volver a chats)"
    commands:
      - tapOn: "(Back to chats|Volver a chats)"
- tapOn: "Chats"
- tapOn: "People"
- extendedWaitUntil:
    visible: "Your people"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*${NAME}.*"
    direction: DOWN
    timeout: 45000
- assertVisible: "Message"
- takeScreenshot: ${SHOT}-person-visible
