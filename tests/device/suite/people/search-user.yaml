appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 31/32): finding a stranger moved off the Contacts list and into
# "Add a friend" — Contacts searches only people you already know. So: Contacts
# → the "Add a friend" control → search a name or @username → the matching row
# appears with its EXPECT_BUTTON ("Message" for anyone, "Blocked" for a blocked
# person). The search runs as you type; there is no submit button.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Contacts"
# A tab tap right after navigation settled elsewhere once on a 6.9-inch
# simulator (Settings opened instead). Recover and tap Contacts again.
- runFlow:
    when:
      notVisible: "Add a friend"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Close settings"
          commands:
            - tapOn: "Close settings"
      - runFlow:
          when:
            notVisible: "Add a friend"
          commands:
            - tapOn: "Contacts"
- extendedWaitUntil:
    visible: "Add a friend"
    timeout: 15000
# The sheet may already be open (the "+" menu opens Contacts with add=1).
- runFlow:
    when:
      notVisible:
        id: "add-friend-search"
    commands:
      - tapOn: "Add a friend"
- extendedWaitUntil:
    visible:
      id: "add-friend-search"
    timeout: 15000
- tapOn:
    id: "add-friend-search"
- eraseText: 40
- inputText: ${USERNAME}
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 20000
- extendedWaitUntil:
    visible: ${EXPECT_BUTTON}
    timeout: 15000
- takeScreenshot: ${SHOT}-result
