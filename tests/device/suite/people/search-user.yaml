appId: com.totallynotwoojin.newone
---
# People → search a name or @username; the matching person row must appear
# with its EXPECT_BUTTON ("Message" for anyone, "Blocked" for a blocked
# person). The search runs as you type; there is no submit button.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "People"
# A tab tap right after navigation settled elsewhere once on a 6.9-inch
# simulator (Settings opened instead). Recover and tap People again.
- runFlow:
    when:
      notVisible: "Search by name or @username"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Close settings"
          commands:
            - tapOn: "Close settings"
      - runFlow:
          when:
            notVisible: "Search by name or @username"
          commands:
            - tapOn: "People"
- extendedWaitUntil:
    visible: "Search by name or @username"
    timeout: 15000
- tapOn: "Search by name or @username"
- eraseText: 40
- inputText: ${USERNAME}
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 20000
- extendedWaitUntil:
    visible: ${EXPECT_BUTTON}
    timeout: 15000
- takeScreenshot: ${SHOT}-result
