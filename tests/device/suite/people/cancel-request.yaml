appId: com.totallynotwoojin.newone
---
# On a search result card showing "Cancel request" (an outgoing pending
# connect request), tap it; the card flips back to "Connect".
- assertVisible: "Cancel request"
- tapOn: "Cancel request"
- extendedWaitUntil:
    visible: "Connect"
    timeout: 20000
- takeScreenshot: ${SHOT}-cancelled
