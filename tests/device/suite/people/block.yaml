appId: com.totallynotwoojin.newone
---
# From the person's row in Contacts → Your people, block them through the row's
# "…" menu (accessibility label "Manage contact and privacy"). The row then
# shows a "Blocked" badge in place of its Message button.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Contacts"
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 30000
- tapOn: ".*Manage contact and privacy ${NAME}.*"
- extendedWaitUntil:
    visible: "Block this person"
    timeout: 15000
- tapOn: "Block this person"
- extendedWaitUntil:
    visible: "Unblock this person"
    timeout: 20000
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: "Blocked"
    timeout: 15000
- takeScreenshot: ${SHOT}-blocked
