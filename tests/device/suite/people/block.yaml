appId: com.totallynotwoojin.newone
---
# From the person's row in People → Your people, block them through the row's
# "…" menu (accessibility label "Manage contact and privacy"). The row then
# shows a "Blocked" badge in place of its Message button.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "People"
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 30000
- tapOn: "Manage contact and privacy"
- extendedWaitUntil:
    visible: "Block this person"
    timeout: 15000
- tapOn: "Block this person"
- extendedWaitUntil:
    visible: "Unblock this person"
    timeout: 20000
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: "Blocked"
    timeout: 15000
- takeScreenshot: ${SHOT}-blocked
