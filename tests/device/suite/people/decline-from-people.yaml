appId: com.totallynotwoojin.newone
---
# Recipient declines a connect request from People → Requests.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Requests"
    timeout: 60000
- assertVisible: ${NAME}
- takeScreenshot: ${SHOT}-request
- tapOn: "Decline"
- extendedWaitUntil:
    notVisible: "Decline"
    timeout: 20000
- takeScreenshot: ${SHOT}-declined
