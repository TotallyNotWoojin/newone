appId: com.totallynotwoojin.newone
---
# Open the conversation with PEER and try to send TEXT; while blocked this
# must fail with a visible error, not render as a normal sent bubble.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: ".*${PEER}.*"
    commands:
      - tapOn: "Chats"
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 30000
# The status banner (Reconnecting…/Offline…) shows briefly after launch and the
# list shifts up when it clears; a tap aimed at a row then lands on the row
# below it (a request row's Decline button, run-2026-09-04T20-41-40). Let the
# banner clear and the list settle before touching a row.
- extendedWaitUntil:
    notVisible: ".*(Reconnecting and checking|Reconectando y|재연결하고|Offline · |Sin conexión · |오프라인 · |Loading…|Cargando…|불러오는 중).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ".*${PEER}.*"
# While blocked the app replaces the composer with a notice ("You cannot send
# messages in this conversation right now.") — fail-closed, and the better
# outcome. Accept that, or a send that is refused with a visible error.
- extendedWaitUntil:
    visible: "(.*Write a message….*|.*cannot send messages.*)"
    timeout: 20000
- runFlow:
    when:
      visible: ".*Write a message….*"
    commands:
      - tapOn:
          id: "composer-input"
      - inputText: ${TEXT}
      - tapOn: "Send message"
      - extendedWaitUntil:
          visible: ".*(Not sent|could not|blocked|failed|permission|error).*"
          timeout: 20000
- assertVisible: "(.*cannot send messages.*|.*(Not sent|could not|blocked|failed|permission|error).*)"
- takeScreenshot: ${SHOT}-blocked-send
