appId: com.totallynotwoojin.newone
---
# Conversation summary: the header "Summarize" button (also offered inside
# Conversation settings) opens the "Summary" sheet. Ask for a summary of the
# whole conversation, wait for the prose, copy it, close the sheet, and record
# exactly what the sheet says at each stage.
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn: "Summarize"
- extendedWaitUntil:
    visible: ".*(Summarize conversation|Summarize new messages|Nothing summarized yet|Generating).*"
    timeout: 15000
- takeScreenshot: ${SHOT}-summary-sheet
# Absent only when an earlier summary already covers every loaded message.
- tapOn:
    text: "Summarize conversation"
    optional: true
- extendedWaitUntil:
    visible: ".*(Generating|No new messages since the last summary|Summary unavailable|Source changed|could not|cannot|failed).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-after-request
# Ready: the new summary covers every loaded message, so the sheet says there
# is nothing new to summarize and Copy/Share become enabled. Failure: "Summary
# unavailable" (consumers see no other status badge).
- extendedWaitUntil:
    visible: ".*(No new messages since the last summary|Summary unavailable|Source changed|could not|cannot|failed).*"
    timeout: 120000
- takeScreenshot: ${SHOT}-final
- assertVisible: "No new messages since the last summary."
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 10000
- takeScreenshot: ${SHOT}-copied
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 15000
