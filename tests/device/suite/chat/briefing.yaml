appId: com.totallynotwoojin.newone
---
# Conversation summary: the header "Summarize" button (also offered inside
# Conversation settings) opens the "Summary" sheet. Ask for a summary of the
# whole conversation, wait for the prose, copy it, close the sheet, and record
# exactly what the sheet says at each stage.
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn: "Summarize"
- extendedWaitUntil:
    visible: ".*(Summarize conversation|Summarize new messages|Nothing summarized yet|Generating).*"
    timeout: 15000
- takeScreenshot: ${SHOT}-summary-sheet
# Absent only when an earlier summary already covers every loaded message.
- tapOn:
    text: "Summarize conversation"
    optional: true
- extendedWaitUntil:
    visible: ".*(Generating|Too long|No messages in this range|Could not summarize|Source changed|Summary unavailable).*"
    timeout: 30000
- takeScreenshot: ${SHOT}-after-request
# v3.1: the sheet has no "since the last summary" state any more. Ready means
# the prose is on screen and Copy/Share are enabled; failure copy is explicit.
- extendedWaitUntil:
    notVisible: "Generating"
    timeout: 180000
- takeScreenshot: ${SHOT}-final
- assertNotVisible: "Summary unavailable"
- assertNotVisible: "Too long — pick a shorter range."
- assertNotVisible: "Could not summarize right now. Try again."
- assertVisible:
    text: "Copy"
    enabled: true
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 10000
- takeScreenshot: ${SHOT}-copied
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 15000
