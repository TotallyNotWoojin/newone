appId: com.totallynotwoojin.newone
---
# Search tab → type QUERY → results arrive as you type (consumers have no
# Search button and no filter chips) → a Messages result ("Open <title>")
# appears under the MESSAGES section.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Search people and messages"
    timeout: 15000
- tapOn: "Search people and messages"
- inputText: ${QUERY}
- extendedWaitUntil:
    visible: ".*Open .*"
    timeout: 30000
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*Open .*"
    direction: DOWN
    timeout: 30000
- assertVisible: "(?i).*messages.*"
- assertVisible: ".*${QUERY}.*"
- takeScreenshot: ${SHOT}-results
