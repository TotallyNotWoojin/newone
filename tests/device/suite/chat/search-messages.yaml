appId: com.totallynotwoojin.newone
---
# Search tab → type QUERY → results arrive as you type (consumers have no
# Search button and no filter chips) → a Messages result ("Open <title>")
# appears under the MESSAGES section.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Search people and messages"
    timeout: 15000
- tapOn: "Search people and messages"
- inputText: ${QUERY}
- extendedWaitUntil:
    visible: ".*Open .*"
    timeout: 30000
# The result is already on screen (waited for above); scrolling for 100%
# visibility fails when the row sits under the tab bar. Dismiss the keyboard
# with a short drag instead of hideKeyboard (flaky while a callout is up).
- swipe:
    start: "50%, 55%"
    end: "50%, 65%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: "(?i).*messages.*"
- assertVisible: ".*${QUERY}.*"
- takeScreenshot: ${SHOT}-results
