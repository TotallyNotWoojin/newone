appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 30): the Search tab is gone — the one field on Chats finds
# people, chats and the messages inside them. Type QUERY and the Messages
# section appears under the field, with a row carrying the matched words.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Search chats, people and messages"
    commands:
      - tapOn: "Chats"
- extendedWaitUntil:
    notVisible: ".*(Reconnecting and checking|Offline · |Loading…).*"
    timeout: 30000
# The Search tab is gone: searching happens in the field on Chats itself.
- assertNotVisible: "Search"
- assertVisible:
    id: "chat-search-field"
- tapOn:
    id: "chat-search-field"
- inputText: ${QUERY}
- extendedWaitUntil:
    visible: "Messages"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*${QUERY}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-results
