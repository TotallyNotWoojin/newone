appId: com.totallynotwoojin.newone
---
# Inside an open conversation: type TEXT and send; it renders in the timeline.
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- tapOn:
    id: "composer-input"
- eraseText: 60
- inputText: ${TEXT}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${TEXT}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-sent
