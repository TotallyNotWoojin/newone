appId: com.totallynotwoojin.newone
---
# Long-press own TARGET → Delete for everyone; it disappears here.
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Delete for everyone"
    direction: DOWN
    timeout: 20000
- tapOn: "Delete for everyone"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 15000
- extendedWaitUntil:
    notVisible: ".*${TARGET}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-deleted
