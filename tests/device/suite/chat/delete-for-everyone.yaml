appId: com.totallynotwoojin.newone
---
# Long-press own TARGET → Delete for everyone; it disappears here.
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: ".*${TARGET}.*"
    direction: DOWN
    timeout: 15000
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: "Delete for everyone"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Delete for everyone"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 15000
- extendedWaitUntil:
    notVisible: ".*${TARGET}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-deleted
