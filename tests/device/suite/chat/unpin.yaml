appId: com.totallynotwoojin.newone
---
# Long-press TARGET → Unpin; Pin is offered again afterwards.
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          direction: DOWN
          duration: 400
- scrollUntilVisible:
    element:
      text: ".*${TARGET}.*"
    direction: DOWN
    timeout: 15000
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Unpin"
    direction: DOWN
    timeout: 15000
- tapOn: "Unpin"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 15000
- takeScreenshot: ${SHOT}-unpinned
