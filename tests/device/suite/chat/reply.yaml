appId: com.totallynotwoojin.newone
---
# Long-press TARGET → Reply → type REPLY → send. The sent bubble carries a
# quoted preview of TARGET.
- longPressOn:
    text: ${TARGET}
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- tapOn: "Reply"
- extendedWaitUntil:
    visible: "Replying to"
    timeout: 10000
- takeScreenshot: ${SHOT}-replying
- tapOn: "Write a message…"
- inputText: ${REPLY}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ${REPLY}
    timeout: 20000
- takeScreenshot: ${SHOT}-reply-sent
