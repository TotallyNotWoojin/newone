appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 47d): the quote on a reply is a way back. Tapping it scrolls to
# the message the reply answers and centres it. The quote reads
# "<sender>: <preview of the original>", and QUOTED is a word from that
# original; ORIGINAL is text only the original bubble carries.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: ".*${REPLY}.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: ${SHOT}-reply-with-quote
# The quote carries the original's sender and its first words.
- assertVisible: "${SENDER}: .*${QUOTED}.*"
- tapOn: "${SENDER}: .*${QUOTED}.*"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: ".*${ORIGINAL}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-jumped-to-original
