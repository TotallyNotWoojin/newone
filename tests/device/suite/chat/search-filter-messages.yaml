appId: com.totallynotwoojin.newone
---
# Consumers have no type-filter chips (the "Messages" chip this flow used to
# tap is workplace-only): the Search tab lists People, then Messages. Open
# the Messages result; the conversation opens with the matched text.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
# The result is already on screen (waited for above); scrolling for 100%
# visibility fails when the row sits under the tab bar. Dismiss the keyboard
# with a short drag instead of hideKeyboard (flaky while a callout is up).
- swipe:
    start: "50%, 55%"
    end: "50%, 65%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-result
- tapOn:
    text: ".*Open .*"
    index: 0
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- assertVisible: ".*${QUERY}.*"
- takeScreenshot: ${SHOT}-opened-from-search
