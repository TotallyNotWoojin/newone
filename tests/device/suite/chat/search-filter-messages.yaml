appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 30/38): the type-filter chips and the "Open <title>" rows went
# with the Search tab. A message suggestion under the Chats field reads
# "<chat> · <the matched words>"; tapping it opens that chat at the message.
# chat/search-messages.yaml has already typed QUERY and left the results up.
- extendedWaitUntil:
    visible: "Messages"
    timeout: 20000
- takeScreenshot: ${SHOT}-result
- tapOn:
    text: ".* · .*${QUERY}.*"
    below: "Messages"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- assertVisible: ".*${QUERY}.*"
- takeScreenshot: ${SHOT}-opened-from-search
