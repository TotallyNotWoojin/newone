appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 46): a short drag right on a bubble starts a reply to it — the
# iMessage gesture with the quoted reply the app already renders. The gesture
# triggers past 56 points.
#
# A directional swipe starts at the middle of the matched element and ends at
# 90% of the screen width, so the runway is only as long as whatever is left of
# the screen. Point TARGET at a bubble from the other person: those sit on the
# left and leave two hundred points to travel. A short own bubble hugs the right
# edge and leaves about sixty, which is inside the threshold's own rounding —
# run-2026-09-07T17-53-35 swiped one and no "Replying to" ever appeared.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: ".*${TARGET}.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: ${SHOT}-before-swipe
- swipe:
    from:
      text: ".*${TARGET}.*"
    direction: RIGHT
    duration: 400
- extendedWaitUntil:
    visible: ".*Replying to.*"
    timeout: 15000
- takeScreenshot: ${SHOT}-replying
- tapOn:
    id: "composer-input"
- inputText: ${REPLY}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${REPLY}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-swipe-reply-sent
