appId: com.totallynotwoojin.newone
---
# Long-press TARGET → Delete for me; it disappears from this device only.
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: ".*${TARGET}.*"
    direction: DOWN
    timeout: 15000
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: "Delete for me"
    direction: DOWN
    timeout: 20000
# The card clips at the safe-area edge while Maestro measures against the screen:
# the last action can sit half outside the card, and a tap on its centre hits
# the backdrop (closes the sheet, no request). Nudge the content up first.
- swipe:
    start: "50%, 72%"
    end: "50%, 40%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${SHOT}-sheet
- tapOn: "Delete for me"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 15000
# In every run today the sheet closed on this tap while the message stayed and
# no hide call reached the service: the tap most likely landed on the backdrop
# after the sheet's content scrolled (stale frame). A person would simply try
# again; do so once, without scrolling this time.
- runFlow:
    when:
      visible: ".*${TARGET}.*"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: ".*${TARGET}.*"
          commands:
            - longPressOn:
                text: ".*${TARGET}.*"
            - extendedWaitUntil:
                visible: "Message actions"
                timeout: 10000
            - waitForAnimationToEnd:
                timeout: 2000
            - scrollUntilVisible:
                element:
                  text: "Delete for me"
                direction: DOWN
                timeout: 20000
            # The card clips at the safe-area edge while Maestro measures against the screen:
            # the last action can sit half outside the card, and a tap on its centre hits
            # the backdrop (closes the sheet, no request). Nudge the content up first.
            - swipe:
                start: "50%, 72%"
                end: "50%, 40%"
                duration: 400
            - waitForAnimationToEnd:
                timeout: 3000
            - takeScreenshot: ${SHOT}-sheet-retry
            - tapOn: "Delete for me"
            - extendedWaitUntil:
                notVisible: "Message actions"
                timeout: 15000
- extendedWaitUntil:
    notVisible: ".*${TARGET}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-hidden
