appId: com.totallynotwoojin.newone
---
# Long-press TARGET → React 👍 → a 👍 chip appears under the message.
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: ".*(Typing Predictions|Dictate).*"
    commands:
      - swipe:
          direction: DOWN
          duration: 400
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- tapOn: "React 👍"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 10000
- extendedWaitUntil:
    visible: "👍"
    timeout: 20000
- takeScreenshot: ${SHOT}-reacted
