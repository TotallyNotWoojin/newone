appId: com.totallynotwoojin.newone
---
# Controls → Conversation notifications: Muted until changed, then a timed
# mute, then remove it, then All activity.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# v3.5: the sheet states the setting on one row and opens the choices.
# The row announces itself as "Conversation notifications: <current setting>" — one
# label, because the Pressable merges its children on iOS — so match part of
# it, not the whole line.
- extendedWaitUntil:
    visible: ".*Conversation notifications.*"
    timeout: 20000
- tapOn: ".*Conversation notifications.*"
- extendedWaitUntil:
    visible: "Muted until changed"
    timeout: 15000
- tapOn: "Muted until changed"
- takeScreenshot: ${SHOT}-muted
- tapOn: "1 hour"
- extendedWaitUntil:
    visible: ".*Timed mute ends.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-timed-mute
- tapOn: "Remove timed mute"
- extendedWaitUntil:
    notVisible: ".*Timed mute ends.*"
    timeout: 20000
- tapOn: "All activity"
- takeScreenshot: ${SHOT}-all-activity
# Two sheets now: the picker, then the controls behind it.
- tapOn: "Close dialog"
- runFlow:
    when:
      visible: "Close dialog"
    commands:
      - tapOn: "Close dialog"
