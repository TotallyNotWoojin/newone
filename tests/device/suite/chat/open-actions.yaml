appId: com.totallynotwoojin.newone
---
# Long-press TARGET to open the Message actions sheet (shared preamble used
# by observation-only steps; most action flows inline this themselves).
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: ".*(Typing Predictions|Dictate).*"
    commands:
      - swipe:
          direction: DOWN
          duration: 400
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- takeScreenshot: ${SHOT}-actions
