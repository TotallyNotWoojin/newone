appId: com.totallynotwoojin.newone
---
# v3.3 (backlog 47b): archive from the chat row. Archiving takes the row off
# the list at once (workspace drops archived conversations from the snapshot),
# so the row going away is the on-screen proof; the area checks the server flag.
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- runFlow:
    when:
      notVisible: ".*${PEER}.*"
    commands:
      - tapOn: "Chats"
- extendedWaitUntil:
    notVisible: ".*(Reconnecting and checking|Offline · |Loading…).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: "Archive"
    timeout: 15000
- takeScreenshot: ${SHOT}-before-archive
- tapOn: "Archive"
- extendedWaitUntil:
    notVisible: ".*${PEER}.*"
    timeout: 30000
- takeScreenshot: ${SHOT}-archived
