appId: com.totallynotwoojin.newone
---
# Switch UI language while a conversation exists: labels change, the
# message original text does not.
- tapOn: "Back to chats"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
# "Language" is a row in the General group at the top of Settings; its picker
# options are labelled "Language: <name>" in the CURRENT UI copy.
- extendedWaitUntil:
    visible: "Language"
    timeout: 15000
- tapOn: "Language"
- extendedWaitUntil:
    visible: "Language: Español"
    timeout: 15000
- tapOn: "Language: Español"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
- tapOn: "Cerrar configuración"
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 20000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*Escribe un mensaje….*"
    timeout: 20000
- assertVisible: ".*${TEXT}.*"
- assertVisible: ".*Volver a chats.*"
- takeScreenshot: ${SHOT}-spanish-conversation
- tapOn: "Volver a chats"
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
- extendedWaitUntil:
    visible: "Idioma"
    timeout: 15000
- tapOn: "Idioma"
- extendedWaitUntil:
    visible: "Idioma: English"
    timeout: 15000
- tapOn: "Idioma: English"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- tapOn: "Close settings"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
