appId: com.totallynotwoojin.newone
---
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Save conversation"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 80
- inputText: ${NAME}
- tapOn:
    text: "Description"
    index: 1
- inputText: ${DESCRIPTION}
- tapOn: "Conversation controls"
- tapOn: "Save conversation"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-renamed
