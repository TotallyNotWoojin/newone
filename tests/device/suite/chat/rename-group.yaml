appId: com.totallynotwoojin.newone
---
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Save conversation"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 80
- inputText: ${NAME}
# The keyboard covers the Description field after typing the name; the tap then
# lands on the keys and the description is appended to the name (chat-33,
# run-2026-09-04T15-47-18). Hide it first, and again before Save.
# A drag sometimes leaves the keyboard up and the next tap lands on the keys
# (chat-33, run-2026-09-06T10-34-23: nothing saved). Tap the "Name"
# caption instead; hideKeyboard is the fallback.
- tapOn:
    text: "Name"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- scrollUntilVisible:
    element:
      text: "Description"
      index: 1
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Description"
    index: 1
- inputText: ${DESCRIPTION}
# A drag sometimes leaves the keyboard up and the next tap lands on the keys
# (chat-33, run-2026-09-06T10-34-23: nothing saved). Tap the "Description"
# caption instead; hideKeyboard is the fallback.
- tapOn:
    text: "Description"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- scrollUntilVisible:
    element:
      text: "Save conversation"
    direction: DOWN
    timeout: 15000
- tapOn: "Save conversation"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Conversation controls"
    commands:
      - tapOn: "Save conversation"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-renamed
