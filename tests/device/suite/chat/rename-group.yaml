appId: com.totallynotwoojin.newone
---
# v3.4: the group's picture, name and description live behind "Edit group
# details", each field commits when it is left, and closing the sheet commits
# too, so there is no Save button.
#
# The name only. With the keyboard up on iOS nothing else in this sheet can be
# reached: not the field below the focused one (the name went into the
# description that way), not the disclosure row above it, and not the close
# control once a growing description has pushed it out of view. hideKeyboard is
# no help either — Maestro dismisses it with a tap outside, which lands on the
# backdrop and closes the sheet. Verified across the single-step runs of
# Sep 8 2026; a description is typed with the keyboard down in group creation
# (groups/create-form-optional), which is where it is covered.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Edit group details"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Edit group details"
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 80
- inputText: ${NAME}
- takeScreenshot: ${SHOT}-typed
# Closing saves it; the control sits at the top, clear of the keyboard.
- tapOn: "Close dialog"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-renamed
