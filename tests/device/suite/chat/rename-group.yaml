appId: com.totallynotwoojin.newone
---
# v3.4: the group's picture, name and description live behind "Edit group
# details", and each field commits when it is left — there is no Save button.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Edit group details"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn: "Edit group details"
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 80
- inputText: ${NAME}
# Tapping the caption leaves the field, which is what saves it. The keyboard
# otherwise covers what comes next and the tap lands on the keys (chat-33,
# run-2026-09-04T15-47-18).
- tapOn:
    text: "Name"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
# The form sits under the header from v3.4, so the description can be behind
# the keyboard rather than below the fold, and the predictive-bar check does
# not always see a keyboard that is up (chat-33, run-2026-09-08T14-51-26).
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: "Description"
      index: 1
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Description"
    index: 1
- inputText: ${DESCRIPTION}
- tapOn:
    text: "Description"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Close dialog"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-renamed
