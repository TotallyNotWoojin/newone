appId: com.totallynotwoojin.newone
---
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Save conversation"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 80
- inputText: ${NAME}
# The keyboard covers the Description field after typing the name; the tap then
# lands on the keys and the description is appended to the name (chat-33,
# run-2026-09-04T15-47-18). Hide it first, and again before Save.
# Drag the sheet a little to dismiss the keyboard (hideKeyboard fails on iOS
# while a spelling callout is up).
- swipe:
    start: "50%, 40%"
    end: "50%, 50%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: "Description"
      index: 1
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Description"
    index: 1
- inputText: ${DESCRIPTION}
# Drag the sheet a little to dismiss the keyboard (hideKeyboard fails on iOS
# while a spelling callout is up).
- swipe:
    start: "50%, 40%"
    end: "50%, 50%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: "Save conversation"
    direction: DOWN
    timeout: 15000
- tapOn: "Save conversation"
- extendedWaitUntil:
    notVisible: "Conversation controls"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${NAME}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-renamed
