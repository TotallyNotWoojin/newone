appId: com.totallynotwoojin.newone
---
# Long-press the peer's TARGET → Report privately → Spam → consent → Submit.
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: ".*${TARGET}.*"
    direction: DOWN
    timeout: 15000
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Report privately"
    direction: DOWN
    timeout: 20000
- tapOn: "Spam"
- scrollUntilVisible:
    element:
      text: "Submit report"
    direction: DOWN
    timeout: 20000
- takeScreenshot: ${SHOT}-report-form
- tapOn:
    text: ".*(I consent|consent|understand).*"
    index: 0
- tapOn: "Submit report"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 20000
- takeScreenshot: ${SHOT}-report-submitted
