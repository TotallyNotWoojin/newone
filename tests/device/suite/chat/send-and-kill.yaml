appId: com.totallynotwoojin.newone
---
# Type, tap send, and immediately force-quit: on relaunch the message must
# be present (delivered from the outbox) rather than lost.
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- tapOn:
    id: "composer-input"
- eraseText: 60
- inputText: ${TEXT}
- tapOn: "Send message"
- stopApp
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 30000
# The status banner (Reconnecting…/Offline…) shows briefly after launch and the
# list shifts up when it clears; a tap aimed at a row then lands on the row
# below it (a request row's Decline button, run-2026-09-04T20-41-40). Let the
# banner clear and the list settle before touching a row.
- extendedWaitUntil:
    notVisible: ".*(Reconnecting and checking|Reconectando y|재연결하고|Offline · |Sin conexión · |오프라인 · |Loading…|Cargando…|불러오는 중).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 30000
# The thread opens at the unread divider when the peer's message is unread,
# so the recovered message can sit below the fold (chat-27, run-15-47-18).
- scrollUntilVisible:
    element:
      text: ".*${TEXT}.*"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-recovered
- extendedWaitUntil:
    notVisible: ".*(Not sent|Queued).*"
    timeout: 45000
- takeScreenshot: ${SHOT}-delivered
