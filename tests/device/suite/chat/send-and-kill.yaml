appId: com.totallynotwoojin.newone
---
# Type, tap send, and immediately force-quit: on relaunch the message must
# be present (delivered from the outbox) rather than lost.
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn: ".*Write a message….*"
- inputText: ${TEXT}
- tapOn: "Send message"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 30000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*${TEXT}.*"
    timeout: 45000
- takeScreenshot: ${SHOT}-recovered
- extendedWaitUntil:
    notVisible: ".*(Not sent|Queued).*"
    timeout: 45000
- takeScreenshot: ${SHOT}-delivered
