appId: com.totallynotwoojin.newone
---
# Type, tap send, and immediately force-quit: on relaunch the message must
# be present (delivered from the outbox) rather than lost.
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- tapOn:
    id: "composer-input"
- eraseText: 60
- inputText: ${TEXT}
- tapOn: "Send message"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 30000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*(Write a message…|Accept|Request pending).*"
    timeout: 30000
# The thread opens at the unread divider when the peer's message is unread,
# so the recovered message can sit below the fold (chat-27, run-15-47-18).
- scrollUntilVisible:
    element:
      text: ".*${TEXT}.*"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-recovered
- extendedWaitUntil:
    notVisible: ".*(Not sent|Queued).*"
    timeout: 45000
- takeScreenshot: ${SHOT}-delivered
