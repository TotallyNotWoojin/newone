appId: com.totallynotwoojin.gist
---
# Chats → the Pinned entry on the browsing row → pins from every chat, grouped
# by the chat that holds them; tapping one opens that chat at the message.
# The flow may start inside a conversation, so it walks back first.
- runFlow:
    when:
      visible: "(Back to chats|Volver a chats)"
    commands:
      - tapOn: "(Back to chats|Volver a chats)"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
# Six filter chips plus Pinned no longer fit a phone width (Sep 14 2026); the
# row scrolls, so bring Pinned in from the right when it is off screen.
# The chip row scrolls sideways and "Open pinned messages" sits at its end.
# Start the swipe on a chip that is on screen at every width: "Bookmarked" is
# the third chip; "Groups" is already cut off on an iPhone
# (run-2026-09-15T03-50-11 chat-10c), so a swipe "from Groups" never begins.
- runFlow:
    when:
      notVisible: "Open pinned messages"
    commands:
      - swipe:
          from:
            text: "Bookmarked"
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible: "Open pinned messages"
    commands:
      - swipe:
          from:
            text: "(DMs|Groups|Announcements)"
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn: "Open pinned messages"
- extendedWaitUntil:
    visible: "Pinned messages"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*${TARGET}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-pinned-across-chats
- tapOn: "Go to this message.*${TARGET}.*"
- extendedWaitUntil:
    notVisible: "Pinned messages"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*${TARGET}.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-pinned-across-chats-opened
