appId: com.totallynotwoojin.newone
---
# Long-press TARGET → Forward to a conversation → pick DEST chip → Forward
# message.
- longPressOn:
    text: ${TARGET}
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Forward to a conversation"
    direction: DOWN
    timeout: 20000
- takeScreenshot: ${SHOT}-forward-targets
- tapOn: ${DEST}
- tapOn: "Forward message"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 20000
- takeScreenshot: ${SHOT}-forwarded
