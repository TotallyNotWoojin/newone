appId: com.totallynotwoojin.newone
---
# Long-press TARGET → "Forward" → "Forward to a chat" → pick DEST chip →
# Forward message. The destination list is folded away behind the sheet's
# Forward button (v3.3), so it has to be opened before there is anything to
# scroll to (run-2026-09-07T17-53-35: the sheet was open, the chips were not).
# The composer keeps the keyboard up after a send; a long-press on a bubble that
# sits behind the keyboard lands on the keys instead. Drag the list to dismiss it
# (keyboardDismissMode="interactive") before touching the message.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 88%"
          duration: 600
- scrollUntilVisible:
    element:
      text: ".*${TARGET}.*"
    direction: DOWN
    timeout: 15000
- longPressOn:
    text: ".*${TARGET}.*"
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Forward"
- scrollUntilVisible:
    element:
      text: "Forward to a chat"
    direction: DOWN
    timeout: 20000
- takeScreenshot: ${SHOT}-forward-targets
- tapOn: ".*${DEST}.*"
- tapOn: "Forward message"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 20000
- takeScreenshot: ${SHOT}-forwarded
