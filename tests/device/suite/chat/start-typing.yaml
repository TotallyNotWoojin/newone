appId: com.totallynotwoojin.gist
---
# A starts typing (no send) so the peer's typing indicator can be observed.
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- tapOn:
    id: "composer-input"
- eraseText: 60
# Type in bursts for ~20 s so the typing broadcast (throttled to one per 3 s)
# repeats while A's flow starts up and looks for the indicator.
- inputText: "typing indicator "
- extendedWaitUntil:
    visible: ".*typing indicator.*"
    timeout: 5000
# Keep typing for about a minute. The watcher on the other phone starts at
# the same moment but its driver can take 30 s to warm up, and six bursts
# (~25 s) were over before it looked (run-2026-09-15T04-21-24 chat-16: B done
# at :43, A watched :47 to 17). Sixteen bursts cover the whole window.
- repeat:
    times: 16
    commands:
      - waitForAnimationToEnd:
          timeout: 3500
      - inputText: "probe "
- extendedWaitUntil:
    visible: ".*typing indicator probe.*"
    timeout: 5000
