appId: com.totallynotwoojin.newone
---
# From the Chats list (not inside the conversation), the peer row shows an
# unread count: the Unread filter chip carries the count ("Unread 1") after the
# peer sent TEXT (run-2026-09-04T09-40-33 screenshot).
- launchApp
# A previous step may have left Settings open, and its "CHATS" section header
# satisfies a wait for "Chats" (text matching ignores case). Close it first.
- runFlow:
    when:
      visible: "Close settings"
    commands:
      - tapOn: "Close settings"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Chats"
    timeout: 45000
- extendedWaitUntil:
    visible: "(.*[0-9]+ unread.*|Unread.*[0-9]+.*)"
    timeout: 45000
- takeScreenshot: ${SHOT}-unread
# The chip announces its count ("Unread 1"), so match the label with or without it.
- tapOn: "Unread( [0-9]+)?"
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 15000
- tapOn: "All"
# The status banner (Reconnecting…/Offline…) shows briefly after launch and the
# list shifts up when it clears; a tap aimed at a row then lands on the row
# below it (a request row's Decline button, run-2026-09-04T20-41-40). Let the
# banner clear and the list settle before touching a row.
- extendedWaitUntil:
    notVisible: ".*(Reconnecting and checking|Reconectando y|재연결하고|Offline · |Sin conexión · |오프라인 · |Loading…|Cargando…|불러오는 중).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*${TEXT}.*"
    timeout: 20000
- tapOn: "Back to chats"
- extendedWaitUntil:
    notVisible: "(.*[0-9]+ unread.*|Unread.*[0-9]+.*)"
    timeout: 20000
- takeScreenshot: ${SHOT}-read
