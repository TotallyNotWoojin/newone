appId: com.totallynotwoojin.newone
---
# Clear whatever draft sits in the composer, then put the keyboard away. (The
# "Original is always preserved" hint this flow used to tap is gone with the
# translation bar.)
- tapOn:
    id: "composer-input"
- eraseText: 60
# A short drag on the list dismisses the keyboard (interactive dismiss);
# hideKeyboard fails on iOS while a spelling callout is up.
- swipe:
    start: "50%, 45%"
    end: "50%, 60%"
    duration: 300
- waitForAnimationToEnd:
    timeout: 1500
