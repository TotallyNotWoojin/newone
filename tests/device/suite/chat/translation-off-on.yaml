appId: com.totallynotwoojin.newone
---
# Controls → Automatic translation: Off, then Automatic again. The hints are
# the consumer copy ("You’ll see messages as they were written." / "Messages
# are translated to your language as they arrive.").
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
# v3.5: the sheet states the setting on one row and opens the choices.
# The row announces itself as "Automatic translation: <current setting>" — one
# label, because the Pressable merges its children on iOS — so match part of
# it, not the whole line.
- extendedWaitUntil:
    visible: ".*Automatic translation.*"
    timeout: 20000
- tapOn: ".*Automatic translation.*"
- extendedWaitUntil:
    visible: "Automatic"
    timeout: 15000
- tapOn: "Off"
- extendedWaitUntil:
    visible: ".*see messages as they were written.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-off
- tapOn: "Automatic"
- extendedWaitUntil:
    visible: ".*translated to your language as they arrive.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-automatic
- tapOn: "Close dialog"
- runFlow:
    when:
      visible: "Close dialog"
    commands:
      - tapOn: "Close dialog"
