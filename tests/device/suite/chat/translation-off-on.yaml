appId: com.totallynotwoojin.newone
---
# Controls → Automatic translation: Off, then Automatic again.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Automatic translation"
    direction: DOWN
    timeout: 20000
- tapOn: "Off"
- extendedWaitUntil:
    visible: ".*You will not request or see derived translations.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-off
- tapOn: "Automatic"
- extendedWaitUntil:
    visible: ".*can contribute a translation target.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-automatic
- tapOn: "Close dialog"
