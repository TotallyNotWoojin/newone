appId: com.totallynotwoojin.newone
---
# Controls → Automatic translation: Off, then Automatic again. The hints are
# the consumer copy ("You’ll see messages as they were written." / "Messages
# are translated to your language as they arrive.").
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Automatic translation"
    direction: DOWN
    timeout: 20000
- tapOn: "Off"
- extendedWaitUntil:
    visible: ".*see messages as they were written.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-off
- tapOn: "Automatic"
- extendedWaitUntil:
    visible: ".*translated to your language as they arrive.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-automatic
- tapOn: "Close dialog"
