appId: com.totallynotwoojin.newone
---
# Controls → Add favorite → label flips to Remove favorite → remove again.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- tapOn: "Add favorite"
- extendedWaitUntil:
    visible: "Remove favorite"
    timeout: 20000
- takeScreenshot: ${SHOT}-favorited
- tapOn: "Close dialog"
# The consumer Chats filter row has no Favorites chip (All · Unread · DMs ·
# Groups · Official); the favorite is proven by the server row and by the
# controls sheet offering Remove favorite (chat-24, run-2026-09-04T15-47-18).
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Remove favorite"
    timeout: 15000
- tapOn: "Remove favorite"
- extendedWaitUntil:
    visible: "Add favorite"
    timeout: 20000
- tapOn: "Close dialog"
