appId: com.totallynotwoojin.newone
---
# Controls → Add favorite → label flips to Remove favorite → remove again.
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Conversation controls"
    timeout: 15000
- tapOn: "Add favorite"
- extendedWaitUntil:
    visible: "Remove favorite"
    timeout: 20000
- takeScreenshot: ${SHOT}-favorited
- tapOn: "Close dialog"
- tapOn: "Back to chats"
# The tap right after the sheet closes can be swallowed by the dismiss
# animation (run 2026-09-04T04-57-19); tap again if the composer is still up.
- runFlow:
    when:
      visible: ".*Write a message….*"
    commands:
      - tapOn: "Back to chats"
- extendedWaitUntil:
    visible: "Start a conversation"
    timeout: 20000
# The filter chips scroll horizontally; "Favorites" sits past "Official".
- scrollUntilVisible:
    element:
      text: "Favorites"
    direction: RIGHT
    timeout: 15000
- tapOn: "Favorites"
- extendedWaitUntil:
    visible: ".*${PEER}.*"
    timeout: 15000
- takeScreenshot: ${SHOT}-favorites-filter
- scrollUntilVisible:
    element:
      text: "All"
    direction: LEFT
    timeout: 15000
- tapOn: "All"
- tapOn: ".*${PEER}.*"
- extendedWaitUntil:
    visible: ".*Write a message….*"
    timeout: 20000
- tapOn: "Conversation settings"
- extendedWaitUntil:
    visible: "Remove favorite"
    timeout: 15000
- tapOn: "Remove favorite"
- extendedWaitUntil:
    visible: "Add favorite"
    timeout: 20000
- tapOn: "Close dialog"
