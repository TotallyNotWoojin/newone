appId: com.totallynotwoojin.newone
---
# Long-press TARGET → Pin; the sheet offers Unpin afterwards.
- longPressOn:
    text: ${TARGET}
- extendedWaitUntil:
    visible: "Message actions"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Pin"
    direction: DOWN
    timeout: 15000
- tapOn: "Pin"
- extendedWaitUntil:
    notVisible: "Message actions"
    timeout: 15000
- takeScreenshot: ${SHOT}-pinned
