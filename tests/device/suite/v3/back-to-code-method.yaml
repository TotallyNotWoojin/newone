appId: com.totallynotwoojin.newone
---
# Recovery after a failed password sign-in: return the sign-in form to the
# code method so common/returning-request.yaml finds its "Continue" button.
- launchApp
- extendedWaitUntil:
    visible: "(Create account|Chats)"
    timeout: 30000
- tapOn:
    text: "Email me a code"
    optional: true
- tapOn:
    text: "Forgot your password? Email me a code instead"
    optional: true
- takeScreenshot: ${SHOT}-code-method
