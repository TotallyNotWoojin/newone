appId: com.totallynotwoojin.newone
---
# Like common/signup-verify.yaml, but the new member accepts the one-time
# "Add a password" offer that follows the code (v3 auth stream) instead of
# tapping "Not now", and leaves the first-launch "Turn on notifications" card
# unanswered so the v3 area can exercise that card as its own step (v3-01).
- assertVisible: "One-time code"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "One-time code"
# Typing occasionally lands before the keyboard is up and the field stays empty
# (chat setup on simulator 2). Check the field holds the code; retype once if not.
- runFlow:
    when:
      notVisible: "${CODE}"
    commands:
      - tapOn: "One-time verification code"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 8
      - inputText: ${CODE}
      - tapOn: "One-time code"
- assertVisible: "${CODE}"
- takeScreenshot: ${SHOT}-code-entered
- scrollUntilVisible:
    element:
      text: "Verify and create account"
    direction: DOWN
    timeout: 15000
- tapOn: "Verify and create account"
# The add-a-password step: title "Add a password", field "New password",
# primary button "Save password", link "Not now".
- extendedWaitUntil:
    visible: "Add a password"
    timeout: 45000
- takeScreenshot: ${SHOT}-add-password
# Reveal the field first so the typed password can be checked on screen.
- tapOn: "Show password"
# "New password" is both the field's caption and the input's accessibility
# name; the caption comes first in the hierarchy, the input after it.
- tapOn:
    id: "new-password"
- inputText: ${PASSWORD}
# The input node index differs between driver versions (the email field needed
# index 2, see common/signup-request.yaml); try the next candidates once each.
- runFlow:
    when:
      notVisible: "${PASSWORD}"
    commands:
      - tapOn:
          id: "new-password"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 40
      - inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: "${PASSWORD}"
    commands:
      - tapOn:
          id: "new-password"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 40
      - inputText: ${PASSWORD}
- assertVisible: "${PASSWORD}"
- takeScreenshot: ${SHOT}-password-typed
- tapOn: "Save password"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 45000
# Let the list settle (the notification card waits for the OS permission read).
# The card is NOT answered here: v3-01 does that as the feature under test.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOT}-signed-in
