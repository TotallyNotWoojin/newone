appId: com.totallynotwoojin.newone
---
# First signed-in launch: the "Turn on notifications" card sits at the top of
# Chats; "Not now" removes it. The card renders only while the OS permission
# is undetermined. A simulator that already answered the system prompt in an
# earlier run never shows it; that case takes the ${SHOT}-card-absent shot
# and the area records it as INFO instead of a failure.
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- evalScript: ${output.card = 'absent'}
- extendedWaitUntil:
    visible: "Turn on notifications"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Turn on notifications"
    commands:
      - evalScript: ${output.card = 'shown'}
      - assertVisible: "Turn on"
      - assertVisible: "Not now"
      - takeScreenshot: ${SHOT}-card
      - tapOn: "Not now"
      - extendedWaitUntil:
          notVisible: "Turn on notifications"
          timeout: 10000
      - assertNotVisible: "Not now"
      - takeScreenshot: ${SHOT}-dismissed
- runFlow:
    when:
      true: ${output.card == 'absent'}
    commands:
      - takeScreenshot: ${SHOT}-card-absent
