appId: com.totallynotwoojin.newone
---
# A returning member signs in with their password (v3 auth stream): the
# "Sign in" mode chip → the "Use password" method chip → email + password →
# the primary button (which also reads "Sign in" in this method) → Chats.
# Starts on the signed-out screen (common/signout.yaml leaves it there).
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "English"
# Before the method is chosen the primary button reads "Continue", so the mode
# chip is the only "Sign in" on screen; address it by index anyway.
- tapOn:
    text: "Sign in"
    index: 0
- extendedWaitUntil:
    visible: "Use password"
    timeout: 15000
- assertVisible: "Email me a code"
- tapOn: "Use password"
- extendedWaitUntil:
    visible: "Your password"
    timeout: 15000
- takeScreenshot: ${SHOT}-password-form
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- eraseText: 120
- inputText: ${EMAIL}
# The label tap after typing commits the field on iOS; on Android the label sits
# behind the keyboard and is not in the accessibility tree, so it is optional.
- tapOn:
    text: "Email address"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Email address" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - tapOn:
          text: "Email address"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn: "Email address"
- assertVisible: "${EMAIL}"
# Reveal the password so the typed value can be checked on screen, then type
# into the field (its placeholder is "Your password").
- tapOn: "Show password"
- tapOn: "Your password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: "${PASSWORD}"
    commands:
      # "Password" names the caption first, then the input.
      - tapOn:
          text: "Password"
          index: 1
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 40
      - inputText: ${PASSWORD}
- assertVisible: "${PASSWORD}"
- takeScreenshot: ${SHOT}-credentials
# Tapping the caption (plain text) puts the keyboard away so the button below
# the field is reachable; the scroll covers the case where it is not.
- tapOn:
    text: "Password"
    index: 0
- scrollUntilVisible:
    element:
      text: "Sign in"
      index: 1
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Sign in"
    index: 1
- extendedWaitUntil:
    visible: "(Chats|Add a password|Not now)"
    timeout: 45000
# An account that already has a password goes straight home: no offer.
- assertNotVisible: "Add a password"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
- takeScreenshot: ${SHOT}-signed-in
