appId: com.totallynotwoojin.newone
---
# A returning member signs in with their password (v3.2 flow): the "Sign in"
# mode chip → email → Continue → the password step → password → Sign in →
# Chats. Env: EMAIL, PASSWORD. Starts on the signed-out screen
# (common/signout.yaml leaves it there). The two halves are the shared
# returning flows so every area signs in the same way.
- runFlow: ../common/returning-request.yaml
- runFlow: ../common/returning-verify.yaml
- takeScreenshot: ${SHOT}-signed-in
