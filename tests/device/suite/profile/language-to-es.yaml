appId: com.totallynotwoojin.newone
---
# Settings → Language → Español: the chrome must switch to Spanish.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
# "Language" is a row in the General group at the top of the screen; it opens a
# picker whose options are labelled "Language: <name>" in the CURRENT UI copy.
- extendedWaitUntil:
    visible: "Language"
    timeout: 15000
- tapOn: "Language"
- extendedWaitUntil:
    visible: "Language: Español"
    timeout: 15000
- takeScreenshot: ${SHOT}-language-picker
- tapOn: "Language: Español"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
- assertVisible: "Idioma"
- scrollUntilVisible:
    element:
      text: "Cerrar sesión en Newone"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-spanish-settings
- tapOn: "Cerrar configuración"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 15000
- assertVisible: "Contactos"
- takeScreenshot: ${SHOT}-spanish-tabs
