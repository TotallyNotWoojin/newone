appId: com.totallynotwoojin.newone
---
# Settings → Display language → English, starting from the Spanish tab bar
# left behind by profile/language-to-es.yaml: the chrome switches back.
- launchApp
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 30000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
# The chip's accessibility label is built from the CURRENT (Spanish) UI copy.
- scrollUntilVisible:
    element:
      text: "Idioma de la interfaz: English"
    direction: DOWN
    timeout: 30000
- tapOn: "Idioma de la interfaz: English"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- assertVisible: "Display language"
- scrollUntilVisible:
    element:
      text: "Sign out of Newone"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-english-settings
- tapOn: "Close settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- assertVisible: "Chats"
- takeScreenshot: ${SHOT}-english-tabs
