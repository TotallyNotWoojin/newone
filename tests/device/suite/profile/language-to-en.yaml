appId: com.totallynotwoojin.newone
---
# Settings → Idioma → English, starting from the Spanish tab bar left behind
# by profile/language-to-es.yaml: the chrome switches back.
- launchApp
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 30000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
# The row label and the picker options are built from the CURRENT (Spanish)
# UI copy.
- extendedWaitUntil:
    visible: "Idioma"
    timeout: 15000
- tapOn: "Idioma"
- extendedWaitUntil:
    visible: "Idioma: English"
    timeout: 15000
- tapOn: "Idioma: English"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- assertVisible: "Language"
- scrollUntilVisible:
    element:
      text: "Sign out of Newone"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-english-settings
- tapOn: "Close settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- assertVisible: "Chats"
- takeScreenshot: ${SHOT}-english-tabs
