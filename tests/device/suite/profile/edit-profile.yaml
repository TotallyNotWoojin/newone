appId: com.totallynotwoojin.newone
---
# Settings → Edit profile: change display name and status, save.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Save profile"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Display name"
    index: 1
- eraseText: 60
- inputText: ${DISPLAY_NAME}
- tapOn: "Edit profile"
- tapOn: "What are you up to?"
- inputText: ${STATUS}
- tapOn: "Edit profile"
- takeScreenshot: ${SHOT}-profile-filled
- tapOn: "Save profile"
- extendedWaitUntil:
    visible: ${DISPLAY_NAME}
    timeout: 20000
- takeScreenshot: ${SHOT}-profile-saved
- extendedWaitUntil:
    notVisible: ".*(could not|cannot|failed).*"
    timeout: 5000
