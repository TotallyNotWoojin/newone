appId: com.totallynotwoojin.newone
---
# Settings → profile row ("Edit profile") → sheet: change display name and
# status, save, then reopen the sheet to read the saved values.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
# The profile row is one accessible element labelled "Edit profile".
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: "Save profile"
    timeout: 15000
# The display-name field exposes two nodes: the label text, then the input
# carrying the same accessibility label.
- tapOn:
    text: "Display name"
    index: 1
- eraseText: 60
- inputText: ${DISPLAY_NAME}
# The status field carries a placeholder ("What are you up to?"), and iOS
# exposes a placeholder as the field's text instead of its accessibility label
# (run-2026-09-06T01-11-11: "Status message" had a single node, the label).
# Tap the placeholder while the status is empty, the label's second node once
# a status exists.
- runFlow:
    when:
      visible: "What are you up to?"
    commands:
      - tapOn: "What are you up to?"
- runFlow:
    when:
      notVisible: "What are you up to?"
    commands:
      - tapOn:
          text: "Status message"
          index: 1
- eraseText: 40
- inputText: ${STATUS}
- hideKeyboard
- takeScreenshot: ${SHOT}-profile-filled
- scrollUntilVisible:
    element:
      text: "Save profile"
    direction: DOWN
    timeout: 10000
- tapOn: "Save profile"
# The sheet closes itself on success. The settings profile row is a single
# accessible element ("Edit profile"), so the saved values are read by
# reopening the sheet.
- extendedWaitUntil:
    notVisible: "Save profile"
    timeout: 20000
- extendedWaitUntil:
    notVisible: ".*(could not|cannot|failed).*"
    timeout: 5000
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: ${DISPLAY_NAME}
    timeout: 15000
- assertVisible: ${STATUS}
- takeScreenshot: ${SHOT}-profile-saved
- tapOn: "Close dialog"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
