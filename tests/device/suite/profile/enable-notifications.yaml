appId: com.totallynotwoojin.newone
---
# Settings → Notifications → "Allow notifications" switch on this (simulator)
# device. The row is not pressable: the label text comes first in the
# hierarchy, the Switch (same accessibility label) second.
- launchApp
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Allow notifications"
    direction: DOWN
    timeout: 45000
- takeScreenshot: ${SHOT}-before
- tapOn:
    text: "Allow notifications"
    index: 1
# The OS permission alert.
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOT}-after
# A simulator has no push token: the error banner names a physical device
# ("Push notifications need a physical device."). A phone registers silently
# and the switch turns on. Record whatever text appeared; anything other than
# the physical-device notice is a finding for the report.
- runFlow:
    when:
      visible: ".*(physical device|could not|cannot|unavailable|failed|not configured|did not answer|not set up).*"
    commands:
      - takeScreenshot: ${SHOT}-error-text
- assertVisible: "Allow notifications"
