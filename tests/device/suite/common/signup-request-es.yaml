appId: com.totallynotwoojin.newone
---
# Same as common/signup-request.yaml, but the human picks Español as their
# language before filling the form; the server stores preferred_language=es.
- launchApp:
    clearState: true
- extendedWaitUntil:
    # A freshly installed build's first cold start took more than 40s under a
    # load average near 400 (groups, run-2026-09-04T05-52-23).
    visible: ".*(Chats|Create account).*"
    timeout: 90000
- runFlow:
    when:
      visible: "Chats"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Close settings"
          timeout: 45000
      - scrollUntilVisible:
          element:
            text: "Sign out of Newone"
          direction: DOWN
          timeout: 45000
      - tapOn: "Sign out of Newone"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "Español"
# From here the whole screen is in Spanish, so every target is the Spanish copy.
- tapOn: "Crear cuenta"
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
# The label tap after typing commits the field on iOS; on Android the label sits
# behind the keyboard and is not in the accessibility tree (android-v3-composer5:
# Tap on "Email address" not found), so it is optional there.
- tapOn:
    text: "Correo electrónico"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Correo electrónico" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - tapOn:
          text: "Correo electrónico"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn: "Correo electrónico"
- assertVisible: "${EMAIL}"
- scrollUntilVisible:
    element:
      text: "tu_usuario"
    direction: DOWN
    timeout: 15000
- tapOn: "tu_usuario"
- inputText: ${USERNAME}
- tapOn:
    text: "Nombre de usuario"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Nombre de usuario" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${USERNAME}"
    commands:
      - tapOn:
          text: "Nombre de usuario"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${USERNAME}
      - tapOn: "Nombre de usuario"
- assertVisible: "${USERNAME}"
- scrollUntilVisible:
    element:
      text: "Tu nombre como lo verán los demás"
    direction: DOWN
    timeout: 15000
- tapOn: "Tu nombre como lo verán los demás"
- inputText: ${DISPLAY_NAME}
- tapOn:
    text: "Nombre para mostrar"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Nombre para mostrar" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${DISPLAY_NAME}"
    commands:
      - tapOn:
          text: "Nombre para mostrar"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${DISPLAY_NAME}
      - tapOn: "Nombre para mostrar"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Contraseña"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Contraseña"
    index: 0
- inputText: Newone-test-2026
- hideKeyboard
- assertVisible: "${DISPLAY_NAME}"
- takeScreenshot: ${SHOT}-form
- scrollUntilVisible:
    element:
      text: "(Continuar de forma segura|Continuar)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continuar de forma segura|Continuar)"
- extendedWaitUntil:
    visible: "Código de un solo uso"
    timeout: 30000
- takeScreenshot: ${SHOT}-code-screen
