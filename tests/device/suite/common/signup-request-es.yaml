appId: com.totallynotwoojin.newone
---
# Same as common/signup-request.yaml, but the human picks Español as their
# language before filling the form; the server stores preferred_language=es.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*(Chats|Create account).*"
    timeout: 40000
- runFlow:
    when:
      visible: "Chats"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Close settings"
          timeout: 15000
      - scrollUntilVisible:
          element:
            text: "Sign out of Newone"
          direction: DOWN
          timeout: 45000
      - tapOn: "Sign out of Newone"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "Español"
# From here the whole screen is in Spanish, so every target is the Spanish copy.
- tapOn: "Crear cuenta"
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- tapOn: "Correo electrónico"
- scrollUntilVisible:
    element:
      text: "tu_usuario"
    direction: DOWN
    timeout: 15000
- tapOn: "tu_usuario"
- inputText: ${USERNAME}
- tapOn: "Nombre de usuario"
- scrollUntilVisible:
    element:
      text: "Tu nombre como lo verán los demás"
    direction: DOWN
    timeout: 15000
- tapOn: "Tu nombre como lo verán los demás"
- inputText: ${DISPLAY_NAME}
- tapOn: "Nombre para mostrar"
- takeScreenshot: ${SHOT}-form
- scrollUntilVisible:
    element:
      text: "Continuar de forma segura"
    direction: DOWN
    timeout: 15000
- tapOn: "Continuar de forma segura"
- extendedWaitUntil:
    visible: "Código de un solo uso"
    timeout: 30000
- takeScreenshot: ${SHOT}-code-screen
