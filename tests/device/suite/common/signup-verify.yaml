appId: com.totallynotwoojin.newone
---
# The user types the code from their real inbox and expects to land in Chats.
- assertVisible: "One-time code"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "One-time code"
- takeScreenshot: ${SHOT}-code-entered
- scrollUntilVisible:
    element:
      text: "Verify and create account"
    direction: DOWN
    timeout: 15000
- tapOn: "Verify and create account"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
- takeScreenshot: ${SHOT}-signed-in
