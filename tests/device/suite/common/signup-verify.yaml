appId: com.totallynotwoojin.newone
---
# The user types the code from their real inbox and expects to land in Chats.
- assertVisible: "One-time code"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "One-time code"
# Typing occasionally lands before the keyboard is up and the field stays empty
# (chat setup on simulator 2). Check the field holds the code; retype once if not.
- runFlow:
    when:
      notVisible: "${CODE}"
    commands:
      - tapOn: "One-time verification code"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 8
      - inputText: ${CODE}
      - tapOn: "One-time code"
- assertVisible: "${CODE}"
- takeScreenshot: ${SHOT}-code-entered
- scrollUntilVisible:
    element:
      text: "Verify and create account"
    direction: DOWN
    timeout: 15000
- tapOn: "Verify and create account"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
# A fresh install shows the "Turn on notifications" card at the top of the
# chats list on the first signed-in launch. A person answers it once; "Not now"
# records the answer so the card never returns. The card waits for the OS
# permission read, so let the list settle before looking for it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Not now"
    optional: true
- takeScreenshot: ${SHOT}-signed-in
