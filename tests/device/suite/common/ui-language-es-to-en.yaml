appId: com.totallynotwoojin.newone
---
# A Spanish-UI user switches the display language back to English from
# Settings. Only the interface language changes; the account language on the
# server is untouched.
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Idioma de la interfaz: English"
    direction: DOWN
    timeout: 30000
- tapOn: "Idioma de la interfaz: English"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- takeScreenshot: ${SHOT}-english-ui
- tapOn: "Close settings"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
