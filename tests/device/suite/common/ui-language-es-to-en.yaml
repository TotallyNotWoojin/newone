appId: com.totallynotwoojin.newone
---
# A Spanish-UI user switches the display language back to English from
# Settings. Only the interface language changes; the account language on the
# server is untouched.
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Cerrar configuración"
    timeout: 15000
# "Idioma" is a row in the General group at the top of the screen; it opens a
# picker whose options are labelled "<picker title>: <language>" in the
# CURRENT (Spanish) UI copy.
- extendedWaitUntil:
    visible: "Idioma"
    timeout: 15000
- tapOn: "Idioma"
- extendedWaitUntil:
    visible: "Idioma: English"
    timeout: 15000
- tapOn: "Idioma: English"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- takeScreenshot: ${SHOT}-english-ui
- tapOn: "Close settings"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
