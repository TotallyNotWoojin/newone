appId: com.totallynotwoojin.newone
---
- assertVisible: "일회용 코드"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "일회용 코드"
# Typing occasionally lands before the keyboard is up and the field stays empty
# (chat setup on simulator 2). Check the field holds the code; retype once if not.
- runFlow:
    when:
      notVisible: "${CODE}"
    commands:
      - tapOn: "일회용 인증 코드"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 8
      - inputText: ${CODE}
      - tapOn: "일회용 코드"
- assertVisible: "${CODE}"
- takeScreenshot: ${SHOT}-code-entered
- scrollUntilVisible:
    element:
      text: "인증하고 계정 만들기"
    direction: DOWN
    timeout: 15000
- tapOn: "인증하고 계정 만들기"
- extendedWaitUntil:
    visible: "(Not now|Ahora no|나중에|Chats|채팅)"
    timeout: 45000
- tapOn:
    text: "(Not now|Ahora no|나중에)"
    optional: true
- extendedWaitUntil:
    visible: "채팅"
    timeout: 40000
# A fresh install shows the "Turn on notifications" card at the top of the
# chats list on the first signed-in launch. A person answers it once; "나중에"
# records the answer so the card never returns. The card waits for the OS
# permission read, so let the list settle before looking for it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "나중에"
    optional: true
- takeScreenshot: ${SHOT}-signed-in
