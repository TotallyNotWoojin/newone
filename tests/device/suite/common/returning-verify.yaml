appId: com.totallynotwoojin.newone
---
# The password step of the returning sign-in (v3.2): type the password (field
# id "password"), Sign in, land on Chats. Follows common/returning-request.yaml.
# Env: PASSWORD.
- extendedWaitUntil:
    visible:
      id: "password"
    timeout: 15000
# Reveal the password so the typed value can be checked on screen.
- tapOn:
    text: "Show password"
    optional: true
- tapOn:
    id: "password"
- eraseText: 60
- inputText: ${PASSWORD}
# The caption tap commits the field and puts the keyboard away ("Password"
# names the caption first, then the input).
- tapOn:
    text: "Password"
    index: 0
    optional: true
# Typing occasionally lands before the keyboard is up and the field stays
# empty. Check the field holds the password; retype once if not.
- runFlow:
    when:
      notVisible: "${PASSWORD}"
    commands:
      - tapOn:
          id: "password"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 60
      - inputText: ${PASSWORD}
      - tapOn:
          text: "Password"
          index: 0
          optional: true
- assertVisible: "${PASSWORD}"
- takeScreenshot: ${SHOT}-password-typed
# The keyboard can cover the button while the driver still reports it visible
# (the tap then lands on a key). The caption tap above puts it away; hideKeyboard
# is the fallback when the keyboard is still up.
- runFlow:
    when:
      visible: "(.*(Typing Predictions|Dictate).*|space)"
    commands:
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
# On the password step the mode chips are hidden, so "Sign in" is the button.
- scrollUntilVisible:
    element:
      text: "Sign in"
    direction: DOWN
    timeout: 15000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "(Chats|채팅|That email or password is incorrect.|.*could not.*|.*Too many.*)"
    timeout: 45000
- assertVisible: "Chats"
# A fresh install shows the "Turn on notifications" card at the top of the
# chats list on the first signed-in launch. A person answers it once; "Not now"
# records the answer so the card never returns. The card waits for the OS
# permission read, so let the list settle before looking for it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Not now"
    optional: true
- takeScreenshot: ${SHOT}-returning-signed-in
