appId: com.totallynotwoojin.newone
---
- assertVisible: "One-time code"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "One-time code"
# Typing occasionally lands before the keyboard is up and the field stays empty
# (chat setup on simulator 2). Check the field holds the code; retype once if not.
- runFlow:
    when:
      notVisible: "${CODE}"
    commands:
      - tapOn: "One-time verification code"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 8
      - inputText: ${CODE}
      - tapOn: "One-time code"
- assertVisible: "${CODE}"
- scrollUntilVisible:
    element:
      text: "(Verify and sign in|Sign in)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Verify and sign in|Sign in)"
- extendedWaitUntil:
    visible: "(Save password|Guardar contraseña|비밀번호 저장|Chats|채팅)"
    timeout: 45000
- runFlow:
    when:
      visible: "(Save password|Guardar contraseña|비밀번호 저장)"
    commands:
      - tapOn: "(New password|Nueva contraseña|새 비밀번호)"
      - inputText: Newone-test-2026
      - hideKeyboard
      - tapOn: "(Save password|Guardar contraseña|비밀번호 저장)"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
# A fresh install shows the "Turn on notifications" card at the top of the
# chats list on the first signed-in launch. A person answers it once; "Not now"
# records the answer so the card never returns. The card waits for the OS
# permission read, so let the list settle before looking for it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Not now"
    optional: true
- takeScreenshot: ${SHOT}-returning-signed-in
