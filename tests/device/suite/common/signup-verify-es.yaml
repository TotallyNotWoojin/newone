appId: com.totallynotwoojin.newone
---
- assertVisible: "Código de un solo uso"
- scrollUntilVisible:
    element:
      text: "000000"
    direction: DOWN
    timeout: 15000
- tapOn: "000000"
- eraseText: 8
- inputText: ${CODE}
- tapOn: "Código de un solo uso"
# Typing occasionally lands before the keyboard is up and the field stays empty
# (chat setup on simulator 2). Check the field holds the code; retype once if not.
- runFlow:
    when:
      notVisible: "${CODE}"
    commands:
      - tapOn: "Código de verificación de un solo uso"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 8
      - inputText: ${CODE}
      - tapOn: "Código de un solo uso"
- assertVisible: "${CODE}"
- takeScreenshot: ${SHOT}-code-entered
- scrollUntilVisible:
    element:
      text: "Verificar y crear la cuenta"
    direction: DOWN
    timeout: 15000
- tapOn: "Verificar y crear la cuenta"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 40000
# A fresh install shows the "Turn on notifications" card at the top of the
# chats list on the first signed-in launch. A person answers it once; "Ahora no"
# records the answer so the card never returns. The card waits for the OS
# permission read, so let the list settle before looking for it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Ahora no"
    optional: true
- takeScreenshot: ${SHOT}-signed-in
