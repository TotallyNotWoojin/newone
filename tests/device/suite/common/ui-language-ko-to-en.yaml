appId: com.totallynotwoojin.newone
---
# A Korean-UI user switches the display language back to English from
# Settings. Only the interface language changes; the account language on the
# server stays ko.
- extendedWaitUntil:
    visible: "채팅"
    timeout: 30000
- tapOn: "설정"
- extendedWaitUntil:
    visible: "설정 닫기"
    timeout: 15000
# "언어" is a row in the General group at the top of the screen; it opens a
# picker whose options are labelled "<picker title>: <language>" in the
# CURRENT (Korean) UI copy.
- extendedWaitUntil:
    visible: "언어"
    timeout: 15000
- tapOn: "언어"
- extendedWaitUntil:
    visible: "언어: English"
    timeout: 15000
- tapOn: "언어: English"
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 15000
- takeScreenshot: ${SHOT}-english-ui
- tapOn: "Close settings"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
