appId: com.totallynotwoojin.newone
---
# An existing member comes back (v3.2 flow): the "Sign in" mode chip, the
# email, Continue. The service looks the account up; for an account with a
# password the password step appears (common/returning-verify.yaml types the
# password). Starts on the signed-out screen. The chip was "Returning member"
# before the Sep 2026 terminology pass (older builds still show it). The chip
# is addressed by index 0 in case an older build also labels the button that way.
- extendedWaitUntil:
    visible: "(Returning member|Sign in)"
    timeout: 20000
- tapOn: "English"
- tapOn:
    text: "(Returning member|Sign in)"
    index: 0
- scrollUntilVisible:
    element:
      id: "sign-in-destination"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "sign-in-destination"
# The field keeps whatever the previous step typed, and a tap lands the cursor
# mid-text, so erasing alone leaves a tail. The iOS clear button empties it.
- tapOn:
    text: "Clear text"
    optional: true
- eraseText: 120
- inputText: ${EMAIL}
# The caption tap after typing commits the field and puts the keyboard away on
# iOS; on Android the caption sits behind the keyboard and is not in the
# accessibility tree, so it is optional there.
- tapOn:
    text: "Email address"
    index: 0
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input by id and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - tapOn:
          id: "sign-in-destination"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Clear text"
          optional: true
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn:
          text: "Email address"
          index: 0
          optional: true
- assertVisible: "${EMAIL}"
- takeScreenshot: ${SHOT}-returning-form
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
# The lookup answers: an account with a password shows the password field.
- extendedWaitUntil:
    visible:
      id: "password"
    timeout: 30000
- takeScreenshot: ${SHOT}-returning-password-step
