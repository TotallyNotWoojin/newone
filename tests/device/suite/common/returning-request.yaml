appId: com.totallynotwoojin.newone
---
# An existing user comes back: picks the "Sign in" mode chip, enters email,
# asks for a code. The chip was "Returning member" before the Sep 2026
# terminology pass (older simulator builds still show it, so both are
# accepted). Code is the default sign-in method, so the primary button reads
# "Continue" here; only the "Use password" method makes it read "Sign in" too,
# which is why the chip is addressed by index 0.
- extendedWaitUntil:
    visible: "(Returning member|Sign in)"
    timeout: 20000
- tapOn: "English"
- tapOn:
    text: "(Returning member|Sign in)"
    index: 0
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
# The field keeps whatever the previous step typed, and a tap lands the cursor
# mid-text, so erasing alone leaves a tail. The iOS clear button empties it.
- tapOn:
    text: "Clear text"
    optional: true
- eraseText: 120
- inputText: ${EMAIL}
# The label tap after typing commits the field on iOS; on Android the label sits
# behind the keyboard and is not in the accessibility tree (android-v3-composer5:
# Tap on "Email address" not found), so it is optional there.
- tapOn:
    text: "Email address"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Email address" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - runFlow:
          when:
            visible:
              id: "sign-in-destination"
          commands:
            - tapOn:
                id: "sign-in-destination"
      - runFlow:
          when:
            notVisible:
              id: "sign-in-destination"
          commands:
            - tapOn:
                text: "Email address"
                index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Clear text"
          optional: true
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn:
          text: "Email address"
          optional: true
- assertVisible: "${EMAIL}"
- takeScreenshot: ${SHOT}-returning-form
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible: "One-time code"
    timeout: 30000
- takeScreenshot: ${SHOT}-returning-code-screen
