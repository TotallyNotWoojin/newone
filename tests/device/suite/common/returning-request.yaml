appId: com.totallynotwoojin.newone
---
# An existing user comes back: picks "Returning member", enters email, asks
# for a code.
- extendedWaitUntil:
    visible: "Returning member"
    timeout: 20000
- tapOn: "English"
- tapOn: "Returning member"
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- eraseText: 120
- inputText: ${EMAIL}
- tapOn: "Email address"
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Email address" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - tapOn:
          text: "Email address"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn: "Email address"
- assertVisible: "${EMAIL}"
- takeScreenshot: ${SHOT}-returning-form
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible: "One-time code"
    timeout: 30000
- takeScreenshot: ${SHOT}-returning-code-screen
