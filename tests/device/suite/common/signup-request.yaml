appId: com.totallynotwoojin.newone
---
# A brand-new user opens the app and fills the sign-up form exactly as a
# human would. If a previous simulated human is still signed in (the iOS
# keychain survives clearState, like a real phone), sign out first.
- launchApp:
    clearState: true
- extendedWaitUntil:
    # A freshly installed build's first cold start took more than 40s under a
    # load average near 400 (groups, run-2026-09-04T05-52-23).
    visible: ".*(Chats|Create account).*"
    timeout: 90000
- runFlow:
    when:
      visible: "Chats"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Close settings"
          timeout: 45000
      - scrollUntilVisible:
          element:
            text: "Sign out of Newone"
          direction: DOWN
          timeout: 45000
      - tapOn: "Sign out of Newone"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "English"
- tapOn: "Create account"
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
# The label tap after typing commits the field on iOS; on Android the label sits
# behind the keyboard and is not in the accessibility tree (android-v3-composer5:
# Tap on "Email address" not found), so it is optional there.
- tapOn:
    text: "Email address"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Email address" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - tapOn:
          text: "Email address"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn: "Email address"
- assertVisible: "${EMAIL}"
- scrollUntilVisible:
    element:
      text: "your_username"
    direction: DOWN
    timeout: 15000
- tapOn: "your_username"
- inputText: ${USERNAME}
- tapOn:
    text: "Username"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Username" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${USERNAME}"
    commands:
      - tapOn:
          text: "Username"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${USERNAME}
      - tapOn: "Username"
- assertVisible: "${USERNAME}"
- scrollUntilVisible:
    element:
      text: "Your name as others will see it"
    direction: DOWN
    timeout: 15000
- tapOn: "Your name as others will see it"
- inputText: ${DISPLAY_NAME}
- tapOn:
    text: "Display name"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "Display name" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${DISPLAY_NAME}"
    commands:
      - tapOn:
          text: "Display name"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${DISPLAY_NAME}
      - tapOn: "Display name"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-password"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "signup-password"
- inputText: Newone-test-2026
- hideKeyboard
- assertVisible: "${DISPLAY_NAME}"
- takeScreenshot: ${SHOT}-form
- scrollUntilVisible:
    element:
      text: "(Continue securely|Continue)"
    direction: DOWN
    timeout: 15000
- tapOn: "(Continue securely|Continue)"
- extendedWaitUntil:
    visible: "One-time code"
    timeout: 30000
- takeScreenshot: ${SHOT}-code-screen
