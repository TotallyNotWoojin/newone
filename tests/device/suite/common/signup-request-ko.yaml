appId: com.totallynotwoojin.newone
---
# Same as common/signup-request.yaml, but the human picks 한국어 as their
# language before filling the form; the server stores preferred_language=ko.
- launchApp:
    clearState: true
- extendedWaitUntil:
    # A freshly installed build's first cold start took more than 40s under a
    # load average near 400 (groups, run-2026-09-04T05-52-23).
    visible: ".*(Chats|Create account).*"
    timeout: 90000
- runFlow:
    when:
      visible: "Chats"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Close settings"
          timeout: 45000
      - scrollUntilVisible:
          element:
            text: "Sign out of Newone"
          direction: DOWN
          timeout: 45000
      - tapOn: "Sign out of Newone"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
- tapOn: "한국어"
# From here the whole screen is in Korean, so every target is the Korean copy.
- tapOn: "계정 만들기"
- scrollUntilVisible:
    element:
      text: "you@example.com"
    direction: DOWN
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
# The label tap after typing commits the field on iOS; on Android the label sits
# behind the keyboard and is not in the accessibility tree (android-v3-composer5:
# Tap on "Email address" not found), so it is optional there.
- tapOn:
    text: "이메일 주소"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "이메일 주소" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${EMAIL}"
    commands:
      - tapOn:
          text: "이메일 주소"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${EMAIL}
      - tapOn: "이메일 주소"
- assertVisible: "${EMAIL}"
- scrollUntilVisible:
    element:
      text: "영문 소문자 아이디"
    direction: DOWN
    timeout: 15000
- tapOn: "영문 소문자 아이디"
- inputText: ${USERNAME}
- tapOn:
    text: "사용자 이름"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "사용자 이름" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${USERNAME}"
    commands:
      - tapOn:
          text: "사용자 이름"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${USERNAME}
      - tapOn: "사용자 이름"
- assertVisible: "${USERNAME}"
- scrollUntilVisible:
    element:
      text: "다른 사람에게 보일 이름"
    direction: DOWN
    timeout: 15000
- tapOn: "다른 사람에게 보일 이름"
- inputText: ${DISPLAY_NAME}
- tapOn:
    text: "표시 이름"
    optional: true
# Simulator typing sometimes drops or reorders characters. Check the field holds
# the exact value; refocus the input (third "표시 이름" node: two label nodes,
# then the field) and retype once if not.
- runFlow:
    when:
      notVisible: "${DISPLAY_NAME}"
    commands:
      - tapOn:
          text: "표시 이름"
          index: 2
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 120
      - inputText: ${DISPLAY_NAME}
      - tapOn: "표시 이름"
# A tap on the caption dismisses the keyboard and any spelling callout the
# earlier typing left behind (hideKeyboard fails while a callout is up).
- tapOn:
    text: "비밀번호"
    index: 0
    optional: true
- scrollUntilVisible:
    element:
      id: "signup-password"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "signup-password"
- inputText: Newone-test-2026
- tapOn:
    text: "비밀번호"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: "${DISPLAY_NAME}"
- takeScreenshot: ${SHOT}-form
- scrollUntilVisible:
    element:
      text: "(안전하게 계속|계속)"
    direction: DOWN
    timeout: 15000
- tapOn: "(안전하게 계속|계속)"
- extendedWaitUntil:
    visible: "일회용 코드"
    timeout: 30000
- takeScreenshot: ${SHOT}-code-screen
