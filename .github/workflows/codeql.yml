name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "29 11 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read
  security-events: write

concurrency:
  group: newone-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0b88f91c1c313eec6a3c4ee6b8342cb564c2060c # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@0b88f91c1c313eec6a3c4ee6b8342cb564c2060c # v4
        with:
          category: /language:javascript-typescript
