<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Newone sign-in code</title>
  </head>
  <body style="margin:0;background:#f5f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e3e7ec;border-radius:16px;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 20px;font-size:20px;font-weight:700;">Newone</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;">Your sign-in code</h1>
                <p style="margin:0 0 24px;color:#52606d;font-size:15px;line-height:1.6;">
                  Enter this one-time code in the Newone app. Do not share it with anyone.
                </p>
                <p style="margin:0 0 24px;padding:18px 20px;background:#f1f4f7;border-radius:12px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:8px;">
                  {{ .Token }}
                </p>
                <p style="margin:0;color:#6b7785;font-size:13px;line-height:1.6;">
                  If you did not request this code, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
